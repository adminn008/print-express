<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Avisos — Gráfica (TV)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDKs (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f9fafb;
            overflow: hidden;
            user-select: none;
        }
        .slide-enter {
            animation: fadeIn 0.8s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
        .progress-bar-fill {
            transition: width 0.1s linear;
        }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-6 relative">

    <!-- 🧭 ÁREA SUPERIOR (Cabeçalho) -->
    <header class="flex justify-between items-center bg-gray-900/80 backdrop-blur border border-gray-800 rounded-2xl p-5 shadow-2xl z-20">
        <div class="flex items-center gap-4">
            <div class="bg-indigo-600 p-3 rounded-xl shadow-lg shadow-indigo-500/30">
                <i data-lucide="printer" class="w-8 h-8 text-white"></i>
            </div>
            <div>
                <h1 id="config-nome" class="text-2xl font-black tracking-tight text-white uppercase">Gráfica Central</h1>
                <p class="text-sm font-semibold tracking-widest text-indigo-400 uppercase">Central de Avisos & Operações</p>
            </div>
        </div>

        <!-- Tag de Status Operacional -->
        <div id="status-operacional-tag" class="flex items-center gap-3 px-5 py-2.5 rounded-full bg-emerald-500/10 border border-emerald-500/30">
            <span id="status-ping" class="w-3.5 h-3.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="status-texto" class="text-emerald-400 font-bold uppercase tracking-wider text-sm">🟢 Atendimento Normal</span>
        </div>

        <!-- Clima, Data, Relógio e Indicador de Interrupção -->
        <div class="flex items-center gap-8">
            <div id="interrupcao-badge" class="hidden items-center gap-2 bg-rose-500/20 border border-rose-500/50 px-3 py-1.5 rounded-xl text-rose-300 font-bold text-xs uppercase animate-pulse">
                <i data-lucide="bell-ring" class="w-4 h-4"></i> Interrupção
            </div>

            <div id="weather-box" class="flex items-center gap-3 bg-gray-800/60 px-4 py-2 rounded-xl border border-gray-700/50">
                <i id="weather-icon" data-lucide="cloud-sun" class="w-6 h-6 text-amber-400"></i>
                <div class="text-right">
                    <div id="temp-display" class="text-lg font-bold">--°C</div>
                    <div id="cidade-display" class="text-xs text-gray-400 font-medium">Carregando...</div>
                </div>
            </div>

            <div class="text-right">
                <div id="clock-display" class="text-3xl font-black tracking-tight text-white font-mono">00:00:00</div>
                <div id="date-display" class="text-xs font-semibold text-gray-400 uppercase">Segunda, 00 de Janeiro</div>
            </div>

            <button id="fullscreen-btn" onclick="toggleFullscreen()" class="p-3 bg-gray-800 hover:bg-gray-700 rounded-xl border border-gray-700 text-gray-300 transition">
                <i data-lucide="maximize-2" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- 📺 ÁREA CENTRAL (Slides & Interrupções Temporárias) -->
    <main id="content-display" class="flex-1 my-6 relative overflow-hidden flex items-center justify-center">
        <!-- Injeção dinâmica do slide/interrupção atual -->
    </main>

    <!-- 📦 PAINEL INFERIOR -->
    <footer class="flex flex-col gap-4 z-20">
        <div class="bg-gray-900/90 border border-gray-800 rounded-2xl p-4 flex items-center gap-6 overflow-x-auto shadow-2xl">
            <div class="flex items-center gap-2 border-r border-gray-800 pr-6 text-indigo-400 font-extrabold uppercase text-sm tracking-wider whitespace-nowrap">
                <i data-lucide="package" class="w-5 h-5"></i>
                <span>Painel de Pedidos:</span>
            </div>
            <div id="pedidos-container" class="flex items-center gap-4 overflow-x-auto w-full py-1">
                <span class="text-gray-500 text-sm italic">Carregando fila de pedidos...</span>
            </div>
        </div>

        <div class="flex items-center justify-between px-2">
            <div id="dots-indicator" class="flex items-center gap-2"></div>
            
            <div class="flex items-center gap-4 w-1/3">
                <span id="offline-indicator" class="hidden text-xs font-bold text-amber-500 bg-amber-500/10 border border-amber-500/20 px-3 py-1 rounded-full flex items-center gap-1">
                    <i data-lucide="wifi-off" class="w-3.5 h-3.5"></i> Modo Offline (Cache Local)
                </span>
                <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden border border-gray-700/50">
                    <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-cyan-400 h-full w-0 progress-bar-fill"></div>
                </div>
            </div>
        </div>
    </footer>

    <audio id="alert-sound" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBX0yE88PDoA2L3g1HOz_dbL1B7_XY3MAE",
            authDomain: "grafica-central-tv.firebaseapp.com",
            projectId: "grafica-central-tv",
            storageBucket: "grafica-central-tv.firebasestorage.app",
            messagingSenderId: "208217971154",
            appId: "1:208217971154:web:c978a2bc63320a9bec100b",
            measurementId: "G-7GSFE8PHKE"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        db.enablePersistence().catch(() => console.warn("Cache offline ativado parcialmente."));

        let appConfig = {
            nomeGrafica: "Gráfica & Editora Express",
            cidade: "São Paulo",
            weatherApiKey: "bd5e378503939ddaee76f12ad7a97608",
            somAtivado: true,
            tvId: "TV1"
        };

        let statusOperacional = {
            tipo: "normal",
            texto: "🟢 Atendimento Normal"
        };

        let rawAvisos = [];
        let avisosList = [];
        let interrupcoesQueue = [];
        let pedidosList = [];

        let currentSlideIndex = 0;
        let isInterrupted = false;
        let currentInterrupcao = null;
        let progressInterval = null;

        const priorityWeights = { 'urgente': 4, 'alta': 3, 'importante': 2, 'normal': 1 };

        function updateClock() {
            const now = new Date();
            document.getElementById('clock-display').innerText = now.toLocaleTimeString('pt-BR');
            const options = { weekday: 'long', day: '2-digit', month: 'long' };
            const dateStr = now.toLocaleDateString('pt-BR', options);
            document.getElementById('date-display').innerText = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function fetchWeather() {
            const cidade = appConfig.cidade || "São Paulo";
            document.getElementById('cidade-display').innerText = cidade;
            try {
                const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(cidade)},BR&units=metric&lang=pt_br&appid=${appConfig.weatherApiKey}`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                document.getElementById('temp-display').innerText = `${Math.round(data.main.temp)}°C`;
            } catch (e) {
                document.getElementById('temp-display').innerText = "🌡️ Indisponível";
            }
        }

        function isContentScheduledAndActive(item) {
            if (item.ativo === false) return false;
            
            // Filtro por TV de destino se configurado
            if (item.tvs && Array.isArray(item.tvs) && item.tvs.length > 0) {
                if (!item.tvs.includes(appConfig.tvId) && !item.tvs.includes('TODAS')) return false;
            }

            const now = new Date();

            // Validade por Data Final/Inicial
            if (item.exibirAte) {
                const until = new Date(item.exibirAte);
                if (now > until) return false;
            }
            if (item.exibirDe) {
                const de = new Date(item.exibirDe);
                if (now < de) return false;
            }

            // Agendamento por Dias da Semana (0 = Dom, 1 = Seg, ..., 6 = Sáb)
            if (item.diasSemana && Array.isArray(item.diasSemana) && item.diasSemana.length > 0) {
                if (!item.diasSemana.includes(now.getDay())) return false;
            }

            // Agendamento por Faixa de Horário HH:mm
            if (item.horaInicio && item.horaFim) {
                const currentMinutes = now.getHours() * 60 + now.getMinutes();
                const [hI, mI] = item.horaInicio.split(':').map(Number);
                const [hF, mF] = item.horaFim.split(':').map(Number);
                const startMinutes = hI * 60 + mI;
                const endMinutes = hF * 60 + mF;
                if (currentMinutes < startMinutes || currentMinutes > endMinutes) return false;
            }

            return true;
        }

        function initFirebaseListeners() {
            window.addEventListener('online', () => document.getElementById('offline-indicator').classList.add('hidden'));
            window.addEventListener('offline', () => document.getElementById('offline-indicator').classList.remove('hidden'));

            db.collection("configuracoes").doc("geral").onSnapshot((doc) => {
                if (doc.exists) {
                    appConfig = { ...appConfig, ...doc.data() };
                    document.getElementById('config-nome').innerText = appConfig.nomeGrafica;
                    fetchWeather();
                }
            });

            db.collection("configuracoes").doc("status").onSnapshot((doc) => {
                if (doc.exists) {
                    statusOperacional = doc.data();
                    updateStatusUI();
                }
            });

            db.collection("avisos").onSnapshot((snapshot) => {
                const items = [];
                snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                rawAvisos = items;
                processContentPipeline();
            });

            db.collection("pedidos").onSnapshot((snapshot) => {
                const items = [];
                snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                pedidosList = items;
                renderPedidosFooter();
                processContentPipeline();
            });
        }

        function processContentPipeline() {
            // Filtrar avisos e pedidos com base em regras
            const validAvisos = rawAvisos.filter(isContentScheduledAndActive);
            
            // Pedidos convertidos em conteúdos para rotação ou interrupção
            const validPedidosContent = pedidosList
                .filter(p => isContentScheduledAndActive(p) && p.ocultarTV !== true)
                .map(p => ({
                    id: p.id || `ped_${p.numero}`,
                    isPedidoContent: true,
                    categoria: "📦 Pedido",
                    titulo: `PEDIDO #${p.numero}`,
                    texto: `${p.cliente ? 'Cliente: ' + p.cliente + ' - ' : ''}${p.descricao || 'Disponível para retirada'}`,
                    status: p.status,
                    modeloPedido: p.modeloExibicao || "destaque",
                    duracao: p.duracao || 10,
                    prioridade: p.prioridade || "normal",
                    modoExibicao: p.tipoExibicao || (p.prioridade === 'urgente' ? 'interrupcao_urgente' : 'rotacao'),
                    dadosPedido: p
                }));

            const allContents = [...validAvisos, ...validPedidosContent];

            // Separa Rotação Normal de Interrupções
            const rotationItems = allContents.filter(c => 
                !c.modoExibicao || c.modoExibicao === 'rotacao' || c.modoExibicao === 'normal'
            );

            // Ordena rotação normal por prioridade (fixados/urgentes no topo)
            rotationItems.sort((a, b) => {
                if (a.fixado !== b.fixado) return a.fixado ? -1 : 1;
                return (priorityWeights[b.prioridade] || 1) - (priorityWeights[a.prioridade] || 1);
            });

            avisosList = rotationItems;

            // Filtra e organiza interrupções pendentes por prioridade
            interrupcoesQueue = allContents.filter(c => 
                c.modoExibicao === 'interrupcao' || c.modoExibicao === 'interrupcao_urgente' || c.prioridade === 'urgente'
            );

            interrupcoesQueue.sort((a, b) => (priorityWeights[b.prioridade] || 1) - (priorityWeights[a.prioridade] || 1));

            // Ajustar o índice atual de slides caso o vetor mude
            if (currentSlideIndex >= avisosList.length) {
                currentSlideIndex = 0;
            }

            if (!isInterrupted && progressInterval === null) {
                startNextCycle();
            }
        }

        function updateStatusUI() {
            const ping = document.getElementById('status-ping');
            const txt = document.getElementById('status-texto');
            const container = document.getElementById('status-operacional-tag');

            txt.innerText = statusOperacional.texto;
            if (statusOperacional.tipo === 'urgente' || statusOperacional.tipo === 'indisponivel') {
                container.className = "flex items-center gap-3 px-5 py-2.5 rounded-full bg-rose-500/10 border border-rose-500/30";
                ping.className = "w-3.5 h-3.5 rounded-full bg-rose-500 animate-ping";
                txt.className = "text-rose-400 font-bold uppercase tracking-wider text-sm";
            } else if (statusOperacional.tipo === 'alerta') {
                container.className = "flex items-center gap-3 px-5 py-2.5 rounded-full bg-amber-500/10 border border-amber-500/30";
                ping.className = "w-3.5 h-3.5 rounded-full bg-amber-500 animate-pulse";
                txt.className = "text-amber-400 font-bold uppercase tracking-wider text-sm";
            } else {
                container.className = "flex items-center gap-3 px-5 py-2.5 rounded-full bg-emerald-500/10 border border-emerald-500/30";
                ping.className = "w-3.5 h-3.5 rounded-full bg-emerald-500 animate-pulse";
                txt.className = "text-emerald-400 font-bold uppercase tracking-wider text-sm";
            }
        }

        function renderPedidosFooter() {
            const container = document.getElementById('pedidos-container');
            container.innerHTML = '';

            const visiblePedidos = pedidosList.filter(p => p.ocultarTV !== true);

            if (visiblePedidos.length === 0) {
                container.innerHTML = `<span class="text-gray-500 text-sm italic">Nenhum pedido ativo no momento.</span>`;
                return;
            }

            visiblePedidos.forEach(p => {
                let badgeClass = "bg-gray-800 text-gray-300 border-gray-700";
                let icon = "clock";

                if (p.status === 'pronto') {
                    badgeClass = "bg-emerald-500/20 text-emerald-300 border-emerald-500/40 animate-pulse";
                    icon = "check-circle";
                } else if (p.status === 'producao') {
                    badgeClass = "bg-amber-500/20 text-amber-300 border-amber-500/40";
                    icon = "cog";
                } else if (p.status === 'aguardando') {
                    badgeClass = "bg-orange-500/20 text-orange-300 border-orange-500/40";
                    icon = "alert-circle";
                } else if (p.status === 'entregue') {
                    badgeClass = "bg-blue-500/20 text-blue-300 border-blue-500/40";
                    icon = "package-check";
                }

                const item = document.createElement('div');
                item.className = `flex items-center gap-2.5 px-4 py-2 rounded-xl border ${badgeClass} text-sm font-bold whitespace-nowrap shadow-sm`;
                item.innerHTML = `
                    <i data-lucide="${icon}" class="w-4 h-4"></i>
                    <span>PEDIDO #${p.numero}</span>
                    <span class="opacity-75 font-normal text-xs">(${p.cliente || 'Geral'})</span>
                    <span class="uppercase text-xs font-black px-2 py-0.5 rounded bg-black/30">${p.status}</span>
                `;
                container.appendChild(item);
            });
            lucide.createIcons();
        }

        function startNextCycle() {
            if (progressInterval) clearInterval(progressInterval);

            // Checa interrupção
            if (interrupcoesQueue.length > 0) {
                isInterrupted = true;
                currentInterrupcao = interrupcoesQueue.shift(); // Consome a interrupção
                document.getElementById('interrupcao-badge').classList.remove('hidden');
                document.getElementById('interrupcao-badge').classList.add('flex');
                renderContent(currentInterrupcao);
                runProgressBar(currentInterrupcao.duracao || 10, () => {
                    isInterrupted = false;
                    currentInterrupcao = null;
                    document.getElementById('interrupcao-badge').classList.add('hidden');
                    document.getElementById('interrupcao-badge').classList.remove('flex');
                    // Retorna exatamente para o slide onde estava sem avançar
                    startNextCycle();
                });
                return;
            }

            // Rotação Normal
            if (avisosList.length === 0) {
                renderEmptyState();
                return;
            }

            const activeItem = avisosList[currentSlideIndex];
            renderContent(activeItem);

            runProgressBar(activeItem.duracao || 10, () => {
                // Avança para o próximo slide
                currentSlideIndex = (currentSlideIndex + 1) % avisosList.length;
                startNextCycle();
            });
        }

        function renderEmptyState() {
            const main = document.getElementById('content-display');
            main.innerHTML = `
                <div class="text-center p-12 bg-gray-900/40 border border-gray-800 rounded-3xl">
                    <i data-lucide="tv" class="w-16 h-16 text-gray-600 mx-auto mb-4"></i>
                    <h2 class="text-2xl font-bold text-gray-400">Central de Avisos Pronta</h2>
                    <p class="text-sm text-gray-600 mt-2">Aguardando novos conteúdos cadastrados na Central de Controle.</p>
                </div>
            `;
            lucide.createIcons();
            renderDots();
        }

        function renderContent(item) {
            const main = document.getElementById('content-display');
            main.innerHTML = '';

            const card = document.createElement('div');
            card.className = "w-full h-full flex flex-col justify-center items-center slide-enter px-8";

            if ((item.prioridade === 'alta' || item.prioridade === 'urgente') && appConfig.somAtivado) {
                const sound = document.getElementById('alert-sound');
                sound.play().catch(() => {});
            }

            // Exibição Especial para Pedidos
            if (item.isPedidoContent) {
                const p = item.dadosPedido;
                if (item.modeloPedido === 'lista') {
                    const listRows = pedidosList.map(ped => `
                        <div class="flex justify-between items-center bg-gray-800/80 p-5 rounded-2xl border border-gray-700">
                            <span class="text-2xl font-black text-white">#${ped.numero} — ${ped.cliente || 'Geral'}</span>
                            <span class="text-xl font-bold uppercase px-4 py-2 rounded-xl ${ped.status === 'pronto' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-amber-500/20 text-amber-400'}">${ped.status}</span>
                        </div>
                    `).join('');

                    card.innerHTML = `
                        <div class="w-full max-w-5xl bg-gray-900/90 border border-gray-800 rounded-3xl p-10 shadow-2xl">
                            <h2 class="text-3xl font-black text-indigo-400 mb-6 flex items-center gap-3">
                                <i data-lucide="package" class="w-8 h-8"></i> PAINEL GERAL DE PEDIDOS
                            </h2>
                            <div class="grid gap-4 max-h-[60vh] overflow-y-auto pr-2">${listRows}</div>
                        </div>
                    `;
                } else if (item.modeloPedido === 'tabela') {
                    const tableRows = pedidosList.map(ped => `
                        <tr class="border-b border-gray-800 text-xl font-bold">
                            <td class="py-4 px-6 text-indigo-400">#${ped.numero}</td>
                            <td class="py-4 px-6 text-white">${ped.cliente || 'Balcão'}</td>
                            <td class="py-4 px-6 text-gray-300">${ped.descricao || '-'}</td>
                            <td class="py-4 px-6 uppercase ${ped.status === 'pronto' ? 'text-emerald-400' : 'text-amber-400'}">${ped.status}</td>
                        </tr>
                    `).join('');

                    card.innerHTML = `
                        <div class="w-full max-w-6xl bg-gray-900/90 border border-gray-800 rounded-3xl p-10 shadow-2xl">
                            <h2 class="text-3xl font-black text-white mb-6">📦 TABELA DE PEDIDOS</h2>
                            <table class="w-full text-left">
                                <thead>
                                    <tr class="text-xs uppercase text-gray-400 border-b border-gray-800">
                                        <th class="pb-4 px-6">Pedido</th>
                                        <th class="pb-4 px-6">Cliente</th>
                                        <th class="pb-4 px-6">Descrição</th>
                                        <th class="pb-4 px-6">Status</th>
                                    </tr>
                                </thead>
                                <tbody>${tableRows}</tbody>
                            </table>
                        </div>
                    `;
                } else {
                    // Modelo Destaque
                    card.innerHTML = `
                        <div class="w-full max-w-4xl bg-gradient-to-br from-indigo-950/80 to-gray-900 border-2 border-indigo-500/50 rounded-3xl p-12 text-center shadow-2xl">
                            <div class="inline-flex p-4 rounded-2xl bg-indigo-500/20 text-indigo-400 mb-6 border border-indigo-500/30">
                                <i data-lucide="package-check" class="w-16 h-16"></i>
                            </div>
                            <span class="block text-sm font-black uppercase tracking-widest text-indigo-400 mb-2">STATUS DE PEDIDO</span>
                            <h2 class="text-6xl font-black text-white mb-4">PEDIDO #${p.numero}</h2>
                            <p class="text-3xl font-bold text-emerald-400 uppercase tracking-wide mb-6">PRONTO PARA RETIRADA 🟢</p>
                            <p class="text-xl text-gray-300 max-w-2xl mx-auto">${p.descricao || 'Retirar no balcão principal.'}</p>
                        </div>
                    `;
                }
            } 
            // Modelos de Avisos Normais
            else if (item.formato === 'imagem' && item.imagem) {
                card.innerHTML = `
                    <div class="grid grid-cols-12 gap-8 w-full max-w-7xl h-5/6 items-center bg-gray-900/60 border border-gray-800 rounded-3xl p-8 shadow-2xl">
                        <div class="col-span-7 h-full rounded-2xl overflow-hidden border border-gray-700/50 relative shadow-inner">
                            <img src="${item.imagem}" class="w-full h-full object-cover" alt="Aviso">
                        </div>
                        <div class="col-span-5 flex flex-col justify-center gap-6">
                            <span class="self-start text-xs font-black uppercase tracking-widest px-4 py-1.5 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">${item.categoria || '📢 Aviso'}</span>
                            <h2 class="text-4xl font-black text-white leading-tight">${item.titulo}</h2>
                            <p class="text-xl text-gray-300 leading-relaxed">${item.texto}</p>
                        </div>
                    </div>
                `;
            } else if (item.formato === 'tabela' && item.tabelaConteudo) {
                let rows = item.tabelaConteudo.map(r => `
                    <tr class="border-b border-gray-800 hover:bg-gray-800/30">
                        <td class="py-5 px-6 font-bold text-xl text-white">${r.item}</td>
                        <td class="py-5 px-6 font-semibold text-lg text-indigo-400">${r.prazo}</td>
                        <td class="py-5 px-6 text-gray-400 text-base">${r.obs || '-'}</td>
                    </tr>
                `).join('');

                card.innerHTML = `
                    <div class="w-full max-w-6xl bg-gray-900/80 border border-gray-800 rounded-3xl p-10 shadow-2xl">
                        <div class="flex items-center gap-4 mb-8 border-b border-gray-800 pb-6">
                            <i data-lucide="table" class="w-10 h-10 text-indigo-400"></i>
                            <div>
                                <span class="text-xs font-bold uppercase tracking-widest text-indigo-400">${item.categoria || '📊 Tabela'}</span>
                                <h2 class="text-3xl font-black text-white">${item.titulo}</h2>
                            </div>
                        </div>
                        <table class="w-full text-left">
                            <thead>
                                <tr class="text-xs uppercase text-gray-400 border-b border-gray-800">
                                    <th class="pb-4 px-6">Serviço / Item</th>
                                    <th class="pb-4 px-6">Prazo Estimado</th>
                                    <th class="pb-4 px-6">Observação</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                `;
            } else if (item.formato === 'video' && item.videoUrl) {
                card.innerHTML = `
                    <div class="w-full max-w-6xl h-full rounded-3xl overflow-hidden border border-gray-800 shadow-2xl bg-black flex items-center justify-center">
                        <iframe class="w-full h-full" src="${item.videoUrl}?autoplay=1&mute=1&loop=1" frameborder="0" allow="autoplay"></iframe>
                    </div>
                `;
            } else if (item.prioridade === 'urgente' || item.prioridade === 'alta') {
                card.innerHTML = `
                    <div class="w-full max-w-5xl bg-gradient-to-br from-rose-950/80 to-gray-900 border-2 border-rose-500/50 rounded-3xl p-12 text-center shadow-2xl relative overflow-hidden">
                        <div class="absolute -top-10 -right-10 w-40 h-40 bg-rose-500/10 rounded-full blur-3xl"></div>
                        <div class="inline-flex p-4 rounded-2xl bg-rose-500/20 text-rose-400 mb-6 border border-rose-500/30">
                            <i data-lucide="alert-triangle" class="w-12 h-12"></i>
                        </div>
                        <span class="block text-sm font-black uppercase tracking-widest text-rose-400 mb-2">${item.categoria || '🚨 Aviso Urgente'}</span>
                        <h2 class="text-5xl font-black text-white mb-6 tracking-tight">${item.titulo}</h2>
                        <p class="text-2xl text-gray-200 max-w-3xl mx-auto leading-relaxed font-medium">${item.texto}</p>
                    </div>
                `;
            } else {
                card.innerHTML = `
                    <div class="w-full max-w-5xl bg-gray-900/60 border border-gray-800 rounded-3xl p-12 text-center shadow-2xl">
                        <div class="inline-flex p-4 rounded-2xl bg-indigo-500/10 text-indigo-400 mb-6 border border-indigo-500/20">
                            <i data-lucide="${item.icone || 'bell'}" class="w-12 h-12"></i>
                        </div>
                        <span class="block text-xs font-bold uppercase tracking-widest text-indigo-400 mb-2">${item.categoria || '📢 Aviso'}</span>
                        <h2 class="text-4xl font-black text-white mb-6">${item.titulo}</h2>
                        <p class="text-2xl text-gray-300 max-w-3xl mx-auto leading-relaxed">${item.texto}</p>
                    </div>
                `;
            }

            main.appendChild(card);
            lucide.createIcons();
            renderDots();
        }

        function renderDots() {
            const container = document.getElementById('dots-indicator');
            container.innerHTML = '';
            
            if (isInterrupted) {
                const dot = document.createElement('div');
                dot.className = 'h-2.5 w-8 rounded-full bg-rose-500 animate-pulse';
                container.appendChild(dot);
                return;
            }

            avisosList.forEach((_, idx) => {
                const dot = document.createElement('div');
                dot.className = `h-2.5 rounded-full transition-all duration-300 ${idx === currentSlideIndex ? 'w-8 bg-indigo-500' : 'w-2.5 bg-gray-800'}`;
                container.appendChild(dot);
            });
        }

        function runProgressBar(seconds, onComplete) {
            const progressBar = document.getElementById('progress-bar');
            progressBar.style.width = '0%';
            
            let elapsed = 0;
            const intervalTime = 100;
            const totalSteps = (seconds * 1000) / intervalTime;

            if (progressInterval) clearInterval(progressInterval);

            progressInterval = setInterval(() => {
                elapsed++;
                const percentage = (elapsed / totalSteps) * 100;
                progressBar.style.width = `${percentage}%`;

                if (elapsed >= totalSteps) {
                    clearInterval(progressInterval);
                    progressInterval = null;
                    if (onComplete) onComplete();
                }
            }, intervalTime);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => alert(`Erro ao ativar Tela Cheia: ${err.message}`));
            } else {
                document.exitFullscreen();
            }
        }

        window.onload = () => {
            fetchWeather();
            renderPedidosFooter();
            initFirebaseListeners();
        };
    </script>
</body>
</html>
