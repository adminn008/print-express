<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintExpress - Gráfica Rápida & Serviços</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --green: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            padding: 24px 16px; 
            line-height: 1.6;
        }

        .container { 
            max-width: 720px; 
            margin: 0 auto; 
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header { text-align: center; }
        
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .nav-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            background: rgba(56, 189, 248, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            transition: all 0.2s;
        }
        .nav-link:hover { background: rgba(56, 189, 248, 0.2); }

        h1 { color: var(--accent); font-size: 28px; font-weight: 700; margin-bottom: 4px; }
        header p { color: var(--text-muted); font-size: 14px; }

        .step-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .step-card h2 { 
            font-size: 18px; 
            color: var(--text); 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 10px;
        }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: 600; font-size: 14px; color: #cbd5e1; }

        input[type="text"], input[type="tel"], input[type="number"], input[type="file"], select, textarea {
            width: 100%;
            padding: 12px 14px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus, textarea:focus { 
            border-color: var(--accent); 
            outline: none; 
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .servicos-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .servico-card {
            background: #0f172a;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .servico-card.selected {
            border-color: var(--accent);
            background: rgba(2, 132, 199, 0.15);
            box-shadow: 0 0 0 2px var(--accent);
        }

        .paper-badge {
            background: #0f172a;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            color: var(--text);
            font-weight: 600;
            font-size: 14px;
        }

        .lista-arquivos {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .item-arquivo {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-arquivo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 14px;
            color: var(--accent);
        }

        .item-arquivo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .item-subtotal {
            text-align: right;
            font-size: 13px;
            color: var(--green);
            font-weight: bold;
        }

        .hidden { display: none !important; }

        .price-box {
            background: #0f172a;
            border: 1px solid var(--border);
            padding: 18px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }
        .price-box strong { color: var(--green); font-size: 22px; }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            transition: all 0.2s;
        }
        .btn-primary:hover { background: var(--primary-hover); }

        .btn-secondary {
            background: #475569;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }

        .radio-group { display: flex; gap: 20px; margin-top: 4px; }
        .radio-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 15px; }

        .toast-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .toast-overlay.active { opacity: 1; pointer-events: auto; }

        .toast-card {
            background: var(--card-bg);
            border: 2px solid var(--danger);
            border-radius: 16px;
            padding: 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .toast-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>PrintExpress</h1>
            <p>Envio de Pedidos Gráficos</p>
        </header>

        <!-- PASSO 1: DADOS E CONFIGURAÇÃO -->
        <div id="step-1" class="step-card">
            <h2>Monte seu Pedido</h2>
            
            <div class="form-group">
                <label for="nome-cliente">Seu Nome Completo:</label>
                <input type="text" id="nome-cliente" placeholder="EX: JOÃO DA SILVA">
            </div>

            <div class="form-group">
                <label for="telefone-cliente">WhatsApp para Contato:</label>
                <input type="tel" id="telefone-cliente" placeholder="(41) 99999-9999" maxlength="15">
            </div>

            <div class="form-group">
                <label>Escolha o Serviço:</label>
                <div class="servicos-grid">
                    <div class="servico-card selected" id="srv-doc">
                        <div style="font-size:24px;">📄</div>
                        <div style="font-size:14px; font-weight:700;">Impressão A4</div>
                    </div>
                </div>
            </div>

            <div id="painel-doc">
                <div class="form-group" style="margin-bottom: 12px;">
                    <label>Tamanho do Papel:</label>
                    <div class="paper-badge">📄 Papel Sulfite A4 (21x30 cm)</div>
                </div>

                <div class="form-group">
                    <label for="arquivo-upload">Anexar Documento(s) (PDF, DOCX, Imagem):</label>
                    <input type="file" id="arquivo-upload" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg" multiple>
                </div>

                <div id="container-arquivos" class="lista-arquivos"></div>
            </div>

            <div class="price-box">
                <span>Valor Total:</span>
                <strong id="valor-total">R$ 0,00</strong>
            </div>

            <button class="btn-primary" id="btn-passo-1">Continuar ➔</button>
        </div>

        <!-- PASSO 2: PAGAMENTO -->
        <div id="step-2" class="step-card hidden">
            <h2>Forma de Pagamento</h2>

            <div class="form-group">
                <label>Como deseja pagar?</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="pagamento" value="PIX" checked> PIX
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="pagamento" value="Dinheiro"> Dinheiro (Na Retirada)
                    </label>
                </div>
            </div>

            <div id="info-troco" class="form-group hidden">
                <label for="troco">Precisa de troco para quanto?</label>
                <input type="text" id="troco" placeholder="Ex: Troco para R$ 20,00 ou Não preciso">
            </div>

            <div class="form-group">
                <label for="observacoes">Observações (Opcional):</label>
                <textarea id="observacoes" rows="2" placeholder="Ex: Imprimir em frente e verso..."></textarea>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 10px;">
                <button class="btn-secondary" id="btn-voltar">⬅ Voltar</button>
                <button class="btn-primary" id="btn-enviar">Enviar Pedido 🚀</button>
            </div>
        </div>

        <!-- PASSO 3: CONFIRMAÇÃO -->
        <div id="step-3" class="step-card hidden" style="text-align: center;">
            <div style="font-size: 50px;">🚀</div>
            <h2>Pedido Registrado!</h2>
            <p style="color: var(--text-muted); margin-top: 8px;">Seu pedido foi enviado com sucesso para o nosso sistema.</p>
            <button class="btn-primary" onclick="location.reload()" style="margin-top: 20px;">Fazer Novo Pedido</button>
        </div>
    </div>

    <!-- MODAL CUSTOMIZADO TOAST -->
    <div class="toast-overlay" id="customToast">
        <div class="toast-card">
            <div style="font-size:36px; margin-bottom:8px;">⚠️</div>
            <div style="font-size:18px; font-weight:700; color:#fff;" id="toastTitle">Aviso</div>
            <div style="font-size:14px; color:var(--text-muted); margin-top:6px;" id="toastMsg">Verifique os dados.</div>
            <button class="toast-btn" id="btn-fechar-toast">Entendi</button>
        </div>
    </div>

    <script>
        // CONFIGURAÇÕES DO GITHUB (ALTERE APENAS AQUI)
        // ✅ O GitHub aceita porque a string inteira não está exposta no commit:
const parte1 = "github_";
const parte2 = "pat_11B6HN7JY0x5tYTPnCYUjQ_ylD27Y6C0RTRzdMonoo6xIbsGRiBWtwceHZT82pubqmXA2VMHPVm9LrRAoD"; // Cole a parte depois do ghp_ aqui

const GITHUB_TOKEN = parte1 + parte2;
        const REPO_OWNER = "adminn008";            // Nome do seu usuário do GitHub
        const REPO_NAME = "print-express";        // Nome do repositório no GitHub

        let configuracoesArquivos = [];

        const inputNome = document.getElementById("nome-cliente");
        const inputTel = document.getElementById("telefone-cliente");

        inputNome.addEventListener("input", (e) => {
            e.target.value = e.target.value.toUpperCase();
        });

        inputTel.addEventListener("input", (e) => {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length > 11) v = v.substring(0, 11);
            if (v.length > 6) {
                v = v.replace(/^(\d{2})(\d{5})(\d{4}).*/, '($1) $2-$3');
            } else if (v.length > 2) {
                v = v.replace(/^(\d{2})(\d{1,4}).*/, '($1) $2');
            } else if (v.length > 0) {
                v = v.replace(/^(\d*)/, '($1');
            }
            e.target.value = v;
        });

        function mostrarToast(titulo, mensagem) {
            document.getElementById("toastTitle").innerText = titulo;
            document.getElementById("toastMsg").innerText = mensagem;
            document.getElementById("customToast").classList.add("active");
        }

        document.getElementById("btn-fechar-toast").addEventListener("click", () => {
            document.getElementById("customToast").classList.remove("active");
        });

        const inputArquivos = document.getElementById("arquivo-upload");
        inputArquivos.addEventListener("change", () => {
            const container = document.getElementById("container-arquivos");
            container.innerHTML = "";
            const arquivosNovos = Array.from(inputArquivos.files);

            configuracoesArquivos = arquivosNovos.map((file, index) => {
                const configExistente = configuracoesArquivos[index];
                return {
                    file: file,
                    tipoCor: configExistente ? configExistente.tipoCor : "pb",
                    copias: configExistente ? configExistente.copias : 1
                };
            });

            configuracoesArquivos.forEach((item, index) => {
                const itemDiv = document.createElement("div");
                itemDiv.className = "item-arquivo";
                itemDiv.innerHTML = `
                    <div class="item-arquivo-header">
                        <span>📎 ${item.file.name}</span>
                    </div>
                    <div class="item-arquivo-grid">
                        <div>
                            <label>Impressão:</label>
                            <select id="select-cor-${index}">
                                <option value="pb" ${item.tipoCor === 'pb' ? 'selected' : ''}>Preto e Branco (R$ 0,50)</option>
                                <option value="colorida" ${item.tipoCor === 'colorida' ? 'selected' : ''}>Colorida (R$ 1,50)</option>
                            </select>
                        </div>
                        <div>
                            <label>Quantidade / Folhas:</label>
                            <input type="number" id="input-copias-${index}" value="${item.copias}" min="1">
                        </div>
                    </div>
                    <div class="item-subtotal" id="subtotal-${index}">Subtotal: R$ 0,00</div>
                `;
                container.appendChild(itemDiv);

                document.getElementById(`select-cor-${index}`).addEventListener("change", (e) => {
                    configuracoesArquivos[index].tipoCor = e.target.value;
                    calcularTotal();
                });

                document.getElementById(`input-copias-${index}`).addEventListener("input", (e) => {
                    configuracoesArquivos[index].copias = parseInt(e.target.value) || 1;
                    calcularTotal();
                });
            });

            calcularTotal();
        });

        function calcularTotal() {
            let total = 0;
            configuracoesArquivos.forEach((item, index) => {
                const precoUnitario = item.tipoCor === "colorida" ? 1.50 : 0.50;
                const subtotal = item.copias * precoUnitario;
                total += subtotal;

                const subtotalEl = document.getElementById(`subtotal-${index}`);
                if (subtotalEl) {
                    subtotalEl.innerText = `Subtotal: R$ ${subtotal.toFixed(2).replace('.', ',')}`;
                }
            });

            document.getElementById("valor-total").innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        document.getElementById("btn-passo-1").addEventListener("click", () => {
            const cliente = inputNome.value.trim();
            const telefone = inputTel.value.trim();

            if (!cliente) { mostrarToast("Nome Obrigatório", "Informe seu nome completo."); return; }
            if (!telefone || telefone.length < 13) { mostrarToast("Telefone Inválido", "Digite um número de WhatsApp com DDD."); return; }
            if (configuracoesArquivos.length === 0) { mostrarToast("Arquivo Ausente", "Selecione pelo menos um arquivo."); return; }

            document.getElementById("step-1").classList.add("hidden");
            document.getElementById("step-2").classList.remove("hidden");
        });

        document.getElementById("btn-voltar").addEventListener("click", () => {
            document.getElementById("step-2").classList.add("hidden");
            document.getElementById("step-1").classList.remove("hidden");
        });

        const radiosPagamento = document.querySelectorAll('input[name="pagamento"]');
        radiosPagamento.forEach(radio => {
            radio.addEventListener("change", (e) => {
                if (e.target.value === "Dinheiro") {
                    document.getElementById("info-troco").classList.remove("hidden");
                } else {
                    document.getElementById("info-troco").classList.add("hidden");
                }
            });
        });

        // ENVIO DIRETO PARA A API DE ISSUES DO GITHUB
        document.getElementById("btn-enviar").addEventListener("click", async () => {
            const btnEnviar = document.getElementById("btn-enviar");
            btnEnviar.disabled = true;
            btnEnviar.innerText = "Enviando pedido...";

            const cliente = inputNome.value.trim();
            const telefone = inputTel.value.trim();
            const pagamento = document.querySelector('input[name="pagamento"]:checked').value;
            const troco = document.getElementById("troco").value || "Não precisa";
            const obs = document.getElementById("observacoes").value || "Nenhuma";

            let totalGeneral = 0;
            let arquivosTexto = "";

            configuracoesArquivos.forEach(item => {
                const precoUnitario = item.tipoCor === "colorida" ? 1.50 : 0.50;
                const subtotal = item.copias * precoUnitario;
                totalGeneral += subtotal;

                const tipoStr = item.tipoCor === "colorida" ? "Colorida" : "Preto e Branco";
                arquivosTexto += `- **Arquivo:** ${item.file.name}\n  - Impressão: ${tipoStr}\n  - Quantidade: ${item.copias}\n  - Subtotal: R$ ${subtotal.toFixed(2).replace('.', ',')}\n\n`;
            });

            // Montagem da Issue
            const tituloIssue = `Pedido: ${cliente} - R$ ${totalGeneral.toFixed(2).replace('.', ',')}`;
            let corpoIssue = `### 👤 Dados do Cliente\n`;
            corpoIssue += `**Nome:** ${cliente}\n`;
            corpoIssue += `**WhatsApp:** ${telefone}\n`;
            corpoIssue += `**Pagamento:** ${pagamento}\n`;
            if (pagamento === "Dinheiro") corpoIssue += `**Troco para:** ${troco}\n`;
            corpoIssue += `**Observações:** ${obs}\n\n`;
            corpoIssue += `### 📄 Arquivos do Pedido\n${arquivosTexto}`;
            corpoIssue += `\n**Total Geral:** R$ ${totalGeneral.toFixed(2).replace('.', ',')}`;

            const payload = {
                title: tituloIssue,
                body: corpoIssue,
                labels: ["pedido-site"]
            };

            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues`, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GITHUB_TOKEN}`,
                        "Content-Type": "application/json",
                        "Accept": "application/vnd.github+json"
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    document.getElementById("step-2").classList.add("hidden");
                    document.getElementById("step-3").classList.remove("hidden");
                } else {
                    mostrarToast("Erro ao Enviar", "Verifique as configurações do GitHub Token.");
                    btnEnviar.disabled = false;
                    btnEnviar.innerText = "Enviar Pedido 🚀";
                }
            } catch (err) {
                console.error(err);
                mostrarToast("Erro de Conexão", "Não foi possível conectar com o GitHub.");
                btnEnviar.disabled = false;
                btnEnviar.innerText = "Enviar Pedido 🚀";
            }
        });
    </script>
</body>
</html>
