<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar para Impressão - PrintExpress</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px 15px; }
        .container { max-width: 650px; margin: 0 auto; background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        header { text-align: center; margin-bottom: 25px; }
        h1 { color: #38bdf8; font-size: 22px; margin-bottom: 6px; }
        p { color: #94a3b8; font-size: 14px; }
        
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        input[type="text"], input[type="tel"], select, textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:focus, input[type="tel"]:focus, select:focus { border-color: #38bdf8; }
        
        /* Área de arquivos e seleção múltipla */
        .file-upload-box {
            border: 2px dashed #38bdf8;
            background: #0f172a;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background 0.2s;
        }
        .file-upload-box:hover { background: #1a2436; }
        .file-upload-box p { color: #38bdf8; font-weight: 600; }
        
        /* Lista de Arquivos Selecionados com Opções */
        .file-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
        }
        .file-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1e293b;
        }
        .file-name { font-size: 14px; font-weight: 600; color: #f8fafc; word-break: break-all; }
        .file-subtotal { font-weight: 700; color: #34d399; font-size: 14px; }
        
        .file-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        @media (max-width: 480px) {
            .file-options { grid-template-columns: 1fr; }
        }

        /* Card do Total */
        .total-box {
            background: #0284c7;
            border-radius: 10px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
        }
        .total-box span { font-size: 15px; font-weight: 600; color: #ffffff; }
        .total-box h2 { font-size: 22px; font-weight: 700; color: #ffffff; }

        .btn-enviar {
            width: 100%;
            background: #22c55e;
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-enviar:hover { background: #16a34a; }
        .btn-enviar:disabled { background: #475569; cursor: not-allowed; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🖨️ PrintExpress - Envio de Arquivos</h1>
            <p>Selecione um ou vários arquivos e configure a impressão de cada um.</p>
        </header>

        <form id="formImpressao">
            <!-- Dados do Cliente -->
            <div class="form-group">
                <label for="cliente">Seu Nome Completo *</label>
                <input type="text" id="cliente" required placeholder="Ex: Wellington Silva">
            </div>

            <div class="form-group">
                <label for="telefone">WhatsApp para Contato *</label>
                <input type="tel" id="telefone" required placeholder="Ex: (41) 99999-9999">
            </div>

            <!-- Seleção de Arquivos (Múltiplos) -->
            <div class="form-group">
                <label>Arquivos para Impressão *</label>
                <div class="file-upload-box" onclick="document.getElementById('inputArquivos').click()">
                    <p>📂 Clique aqui para escolher os arquivos (um ou mais)</p>
                    <span style="font-size: 12px; color: #64748b;">Suporta PDF, PNG, JPG, Word e outros</span>
                </div>
                <!-- ATRIBUTO multiple ADICIONADO -->
                <input type="file" id="inputArquivos" multiple style="display: none;" onchange="processarArquivos(this.files)">
            </div>

            <!-- Container dinâmico com a lista e configurações de cada arquivo -->
            <div id="listaArquivosContainer"></div>

            <!-- Forma de Pagamento -->
            <div class="form-group">
                <label for="pagamento">Forma de Pagamento *</label>
                <select id="pagamento" onchange="toggleTroco(this.value)">
                    <option value="PIX">PIX</option>
                    <option value="DINHEIRO">Dinheiro na Retirada</option>
                    <option value="CARTAO">Cartão na Retirada</option>
                </select>
            </div>

            <div class="form-group" id="groupTroco" style="display: none;">
                <label for="troco">Troco para quanto?</label>
                <input type="text" id="troco" placeholder="Ex: R$ 50,00">
            </div>

            <div class="form-group">
                <label for="observacoes">Observações Gerais (Opcional)</label>
                <textarea id="observacoes" rows="2" placeholder="Instruções sobre corte, encadernação, etc."></textarea>
            </div>

            <!-- Totalizador Geral -->
            <div class="total-box">
                <span>Total Geral:</span>
                <h2 id="exibicaoTotal">R$ 0,00</h2>
            </div>

            <button type="submit" id="btnEnviar" class="btn-enviar" disabled>Enviar Pedido</button>
        </form>
    </div>

    <!-- FIREBASE AND SCRIPT LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAfh0iZSotPra1olpRWRfwwBP9G8yrdHEc",
            authDomain: "print-express-bfa7c.firebaseapp.com",
            projectId: "print-express-bfa7c",
            storageBucket: "print-express-bfa7c.firebasestorage.app",
            messagingSenderId: "471136646915",
            appId: "1:471136646915:web:8b7b6f92c00d88c7c79b36",
            measurementId: "G-8K5LHHCDFE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Tabela de Preços por folha/tipo
        const PRECOS = {
            "pb_A4": 0.50,         // P&B Simples A4
            "cor_A4": 1.50,        // Colorido A4
            "foto_10x15": 2.50,    // Foto 10x15 Glossy
            "foto_A4": 5.00        // Foto A4 Glossy
        };

        let arquivosProcessados = [];

        // Torna a função global para o onchange do input file
        window.processarArquivos = function(files) {
            if (!files || files.length === 0) return;

            Array.from(files).forEach((file) => {
                // Validação de segurança para arquivos muito grandes (> 10MB) para não quebrar a transmissão
                if (file.size > 10 * 1024 * 1024) {
                    alert(`O arquivo "${file.name}" excede 10MB. Envie arquivos menores ou compactados.`);
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    const idUnico = 'file_' + Math.random().toString(36).substr(2, 9);
                    
                    const novoItem = {
                        id: idUnico,
                        nome: file.name,
                        tipo: file.type,
                        dadosBase64: e.target.result,
                        tipoImpressao: "pb_A4",
                        copias: 1,
                        subtotal: PRECOS["pb_A4"]
                    };

                    arquivosProcessados.push(novoItem);
                    renderizarListaArquivos();
                };
                reader.readAsDataURL(file);
            });
        };

        window.renderizarListaArquivos = function() {
            const container = document.getElementById("listaArquivosContainer");
            container.innerHTML = "";

            if (arquivosProcessados.length === 0) {
                document.getElementById("btnEnviar").disabled = true;
                atualizarTotalGeral();
                return;
            }

            document.getElementById("btnEnviar").disabled = false;

            arquivosProcessados.forEach((item, index) => {
                const fileCard = document.createElement("div");
                fileCard.className = "file-card";
                fileCard.innerHTML = `
                    <div class="file-card-header">
                        <span class="file-name">📄 ${item.nome}</span>
                        <span class="file-subtotal" id="subtotal_${item.id}">R$ ${item.subtotal.toFixed(2).replace('.', ',')}</span>
                    </div>
                    <div class="file-options">
                        <div>
                            <label>Tipo de Impressão</label>
                            <select onchange="atualizarOpcaoArquivo('${item.id}', 'tipoImpressao', this.value)">
                                <option value="pb_A4" ${item.tipoImpressao === 'pb_A4' ? 'selected' : ''}>Preto & Branco A4 (R$ 0,50/un)</option>
                                <option value="cor_A4" ${item.tipoImpressao === 'cor_A4' ? 'selected' : ''}>Colorido A4 (R$ 1,50/un)</option>
                                <option value="foto_10x15" ${item.tipoImpressao === 'foto_10x15' ? 'selected' : ''}>Foto Glossy 10x15 (R$ 2,50/un)</option>
                                <option value="foto_A4" ${item.tipoImpressao === 'foto_A4' ? 'selected' : ''}>Foto Glossy A4 (R$ 5,00/un)</option>
                            </select>
                        </div>
                        <div>
                            <label>Quantidade de Cópias</label>
                            <input type="number" min="1" max="500" value="${item.copias}" onchange="atualizarOpcaoArquivo('${item.id}', 'copias', parseInt(this.value) || 1)">
                        </div>
                    </div>
                    <button type="button" onclick="removerArquivo('${item.id}')" style="background:none; border:none; color:#ef4444; font-size:12px; margin-top:10px; cursor:pointer; text-decoration:underline;">❌ Remover este arquivo</button>
                `;
                container.appendChild(fileCard);
            });

            atualizarTotalGeral();
        };

        window.atualizarOpcaoArquivo = function(id, campo, valor) {
            const item = arquivosProcessados.find(a => a.id === id);
            if (!item) return;

            item[campo] = valor;
            const precoUnitario = PRECOS[item.tipoImpressao] || 0.50;
            item.subtotal = precoUnitario * item.copias;

            document.getElementById(`subtotal_${id}`).innerText = `R$ ${item.subtotal.toFixed(2).replace('.', ',')}`;
            atualizarTotalGeral();
        };

        window.removerArquivo = function(id) {
            arquivosProcessados = arquivosProcessados.filter(a => a.id !== id);
            renderizarListaArquivos();
        };

        function atualizarTotalGeral() {
            const totalGeral = arquivosProcessados.reduce((acc, curr) => acc + curr.subtotal, 0);
            document.getElementById("exibicaoTotal").innerText = `R$ ${totalGeral.toFixed(2).replace('.', ',')}`;
        }

        window.toggleTroco = function(valor) {
            document.getElementById("groupTroco").style.display = (valor === "DINHEIRO") ? "block" : "none";
        };

        // Envio do Pedido consolidado para o Firestore
        document.getElementById("formImpressao").addEventListener("submit", async (e) => {
            e.preventDefault();

            if (arquivosProcessados.length === 0) {
                alert("Por favor, escolha pelo menos um arquivo para enviar.");
                return;
            }

            const btn = document.getElementById("btnEnviar");
            btn.disabled = true;
            btn.innerText = "Enviando pedido...";

            const totalGeral = arquivosProcessados.reduce((acc, curr) => acc + curr.subtotal, 0);

            // Monta o objeto de envio formatado com múltiplos arquivos
            const pedido = {
                cliente: document.getElementById("cliente").value.trim(),
                telefone: document.getElementById("telefone").value.trim(),
                pagamento: document.getElementById("pagamento").value,
                troco: document.getElementById("troco").value.trim() || null,
                observacoes: document.getElementById("observacoes").value.trim() || null,
                total: totalGeral,
                quantidadeArquivos: arquivosProcessados.length,
                
                // Mapeia todos os arquivos em um array
                arquivos: arquivosProcessados.map(a => ({
                    nome: a.nome,
                    tipoImpressao: a.tipoImpressao,
                    copias: a.copias,
                    subtotal: a.subtotal,
                    dadosBase64: a.dadosBase64
                })),

                // Mantém compatibilidade com a versão anterior do painel (exibe o primeiro arquivo diretamente)
                arquivoNome: arquivosProcessados.map(a => `${a.nome} (${a.copias}x)`).join(", "),
                arquivoDados: arquivosProcessados[0].dadosBase64,
                papel: `Múltiplos itens (${arquivosProcessados.length} arq)`,
                quantidade: arquivosProcessados.reduce((acc, curr) => acc + curr.copias, 0),

                concluido: false,
                dataEnvio: serverTimestamp()
            };

            try {
                await addDoc(collection(db, "pedidos"), pedido);
                alert("🎉 Pedido enviado com sucesso! Acompanhe o status com a nossa equipe.");
                window.location.reload();
            } catch (err) {
                console.error("Erro ao salvar pedido:", err);
                alert("Ocorreu um erro ao enviar o pedido. Tente enviar arquivos menores ou verifique sua conexão.");
                btn.disabled = false;
                btn.innerText = "Enviar Pedido";
            }
        });
    </script>
</body>
</html>
