<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo – Utilitários Express</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-body: #090d16;
            --panel-bg: #111827;
            --card-bg: #1f2937;
            --primary: #6366f1;
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --danger: #ef4444;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-line: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; padding: 30px 20px; }

        .container { max-width: 1100px; margin: 0 auto; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--panel-bg); border: 1px solid var(--border-line);
            padding: 20px 30px; border-radius: 16px; margin-bottom: 30px;
        }

        .btn {
            background: var(--primary); color: #fff; border: none; padding: 8px 16px;
            border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.85rem;
        }
        .btn-gold { background: var(--accent-gold); color: #000; font-weight: 700; }
        .btn-danger { background: var(--danger); color: #fff; }

        .table-card {
            background: var(--panel-bg); border: 1px solid var(--border-line);
            border-radius: 16px; overflow: hidden; padding: 20px;
        }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th { padding: 12px 16px; color: var(--text-muted); border-bottom: 1px solid var(--border-line); }
        td { padding: 14px 16px; border-bottom: 1px solid var(--border-line); }

        .badge {
            padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; display: inline-block;
        }
        .badge-free { background: rgba(156, 163, 175, 0.15); color: var(--text-muted); }
        .badge-vip { background: rgba(245, 158, 11, 0.15); color: var(--accent-gold); }

        .access-denied {
            text-align: center; padding: 60px 20px; background: var(--panel-bg);
            border-radius: 16px; border: 1px solid var(--danger); display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ÁREA NEGADA -->
        <div id="accessDenied" class="access-denied">
            <h2 style="color: var(--danger); margin-bottom: 10px;">Acesso Negado 🚫</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Sua conta não possui privilégios de administrador.</p>
            <a href="index.html" class="btn">Voltar para o Início</a>
        </div>

        <!-- CONTEÚDO ADMIN -->
        <div id="adminContent" style="display: none;">
            <div class="header">
                <div>
                    <h2>Painel de Controle Admin</h2>
                    <p style="color: var(--text-muted); font-size: 0.85rem;">Gerencie planos e créditos de usuários</p>
                </div>
                <a href="index.html" class="btn">Voltar para App</a>
            </div>

            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>E-mail</th>
                            <th>Status / Plano</th>
                            <th>Créditos Restantes</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="usersTable">
                        <tr><td colspan="4" style="text-align:center;">Carregando usuários...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyA-ZZ5wB9_2p9vAMRlpJ5JBUliJS3g9g7c",
            authDomain: "utilitarios-express.firebaseapp.com",
            databaseURL: "https://utilitarios-express-default-rtdb.firebaseio.com",
            projectId: "utilitarios-express",
            storageBucket: "utilitarios-express.firebasestorage.app",
            messagingSenderId: "421983822616",
            appId: "1:421983822616:web:bca6f2ebc1b6990871b46d"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ⚠️ ALTE AQUI PARA O SEU E-MAIL REGISTRADO NO FIREBASE
        const EMAIL_ADMIN = "ws8530135@gmail.com";

        auth.onAuthStateChanged(user => {
            if (user && user.email.toLowerCase() === EMAIL_ADMIN.toLowerCase()) {
                document.getElementById('adminContent').style.display = 'block';
                document.getElementById('accessDenied').style.display = 'none';
                carregarUsuarios();
            } else {
                document.getElementById('adminContent').style.display = 'none';
                document.getElementById('accessDenied').style.display = 'block';
            }
        });

        async function carregarUsuarios() {
            const snapshot = await db.collection('usuarios').get();
            const tbody = document.getElementById('usersTable');
            tbody.innerHTML = '';

            snapshot.forEach(doc => {
                const data = doc.data();
                const id = doc.id;
                const isVip = data.isIlimitado;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${data.email || 'Sem e-mail'}</strong></td>
                    <td><span class="badge ${isVip ? 'badge-vip' : 'badge-free'}">${isVip ? 'VIP / Ilimitado' : 'Grátis'}</span></td>
                    <td>${isVip ? '∞' : (data.creditos !== undefined ? data.creditos : 3)}</td>
                    <td>
                        ${isVip 
                            ? `<button class="btn btn-danger" onclick="alterarStatus('${id}', false)">Remover VIP</button>`
                            : `<button class="btn btn-gold" onclick="alterarStatus('${id}', true)">Tornar VIP (30 dias)</button>`
                        }
                        <button class="btn" style="margin-left: 5px;" onclick="resetarCreditos('${id}')">Resetar 3 Créditos</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function alterarStatus(uid, tornarVip) {
            const vencimento = tornarVip ? new Date().getTime() + (30 * 24 * 60 * 60 * 1000) : 0;
            await db.collection('usuarios').doc(uid).update({
                isIlimitado: tornarVip,
                vencimentoIlimitado: vencimento
            });
            carregarUsuarios();
        }

        async function resetarCreditos(uid) {
            await db.collection('usuarios').doc(uid).update({
                creditos: 3,
                ultimaRecarga: new Date().getTime()
            });
            carregarUsuarios();
        }
    </script>
</body>
</html>
