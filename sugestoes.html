<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Avaliações e Sugestões</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeInScale 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            margin-bottom: 20px;
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .icon-badge {
            width: 70px;
            height: 70px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            color: var(--primary);
            font-size: 30px;
            animation: pulseIcon 3s infinite ease-in-out;
        }

        @keyframes pulseIcon {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(99, 102, 241, 0); }
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .action-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 24px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.6);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            transform: translateY(-2px);
        }

        /* Área do Formulário Incorporado (Iframe) */
        #form-container {
            display: none; /* Inicialmente oculto */
            width: 100%;
            max-width: 640px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            animation: fadeInScale 0.5s ease forwards;
        }

        #form-container iframe {
            width: 100%;
            border-radius: 10px;
            background: transparent;
        }

        .close-btn-area {
            text-align: right;
            margin-bottom: 10px;
        }

        .btn-close {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        footer {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        @media (max-width: 480px) {
            .container, #form-container {
                padding: 25px;
            }
            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ícone decorativo animado -->
        <div class="icon-badge">
            💬
        </div>

        <h1>Sua Opinião Importa</h1>
        <p>Este espaço é dedicado exclusivamente a coletar feedbacks, críticas construtivas e novas sugestões. Ajude a aprimorar este espaço compartilhando sua experiência conosco!</p>

        <div class="action-area">
            <!-- Botão que revela o formulário na mesma página -->
            <button onclick="mostrarFormulario()" class="btn btn-primary">
                Preencher Avaliação Aqui
            </button>

            <!-- Botão de Voltar (recarrega ou aponta para uma rota principal se houver) -->
            <a href="index.html" class="btn btn-secondary">
                ← Voltar ao Início
            </a>
        </div>
    </div>

    <!-- Seção do Formulário Incorporado (Aparece ao clicar no botão) -->
    <div id="form-container">
        <div class="close-btn-area">
            <button onclick="ocultarFormulario()" class="btn-close">✕ Fechar Formulário</button>
        </div>
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdKUEtpLu0IoXCUh1qH5cc3p8o-j-fYIc_XztubExaIBq9KRA/viewform?embedded=true" width="640" height="1305" frameborder="0" marginheight="0" marginwidth="0">Carregando…</iframe>
    </div>

    <footer>
        &copy; 2026 Central de Feedback PrintExpress. Todos os direitos reservados.
    </footer>

    <script>
        function mostrarFormulario() {
            const formContainer = document.getElementById('form-container');
            formContainer.style.display = 'block';
            // Rola a tela suavemente para o formulário
            formContainer.scrollIntoView({ behavior: 'smooth' });
        }

        function ocultarFormulario() {
            const formContainer = document.getElementById('form-container');
            formContainer.style.display = 'none';
            // Rola de volta para o topo
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>

</body>
</html>
