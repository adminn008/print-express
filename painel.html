<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Operador - PrintExpress Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        header { text-align: center; margin-bottom: 25px; }
        h1 { color: #38bdf8; font-size: 24px; }
        p { color: #94a3b8; font-size: 14px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Seção de Envio de Aviso Global */
        .aviso-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .aviso-box h2 { font-size: 16px; color: #38bdf8; margin-bottom: 10px; }
        .aviso-box textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            padding: 10px;
            font-size: 14px;
            margin-bottom: 10px;
            resize: vertical;
        }
        .btn-aviso {
            background: #f59e0b;
            color: #000;
            border: none;
            padding: 10px 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-aviso:hover { background: #d97706; }

        /* Cards de Pedidos */
        .pedido-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .pedido-card.concluido {
            opacity: 0.6;
            border-color: #059669;
        }
        .pedido-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .cliente-nome { font-size: 18px; font-weight: bold; color: #f8fafc; }
        .pedido-total { font-size: 18px; font-weight: bold; color: #34d399; }
        .pedido-info { font-size: 14px; color: #cbd5e1; line-height: 1.6; margin-bottom: 15px; }
        
        .btn-group-action { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .btn-download {
            background: #0284c7;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-block;
            transition: background 0.2s;
        }
        .btn-download:hover { background: #0369a1; }
        
        .btn-concluir {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-concluir:hover { background: #059669; }

        /* Pré-visualização do arquivo na tela */
        .preview-container {
            margin-top: 10px;
            margin-bottom: 15px;
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            text-align: center;
        }
        .preview-container img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 4px;
            object-fit: contain;
        }
        .preview-container iframe {
            width: 100%;
            height: 250px;
            border: none;
            border-radius: 4px;
        }

        .sem-pedidos { text-align: center; color: #64748b; margin-top: 50px; font-size: 16px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🖨️ Painel de Operador - PrintExpress</h1>
            <p>Gerencie pedidos em tempo real, visualize arquivos e publique avisos.</p>
        </header>

        <!-- Campo exclusivo para enviar Avisos Globais para o site -->
        <div class="aviso-box">
            <h2>📢 Publicar Aviso Global no Site (index.html)</h2>
            <textarea id="inputAviso" rows="2" placeholder="Digite um aviso importante para aparecer no topo do site dos clientes..."></textarea>
            <button class="btn-aviso" onclick="publicarAviso()">Atualizar Aviso no Site 🚀</button>
        </div>

        <div id="lista-pedidos">
            <p class="sem-pedidos">Carregando pedidos...</p>
        </div>
    </div>

    <!-- LÓGICA DO FIREBASE E INTERFACE DO PAINEL -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAfh0iZSotPra1olpRWRfwwBP9G8yrdHEc",
            authDomain: "print-express-bfa7c.firebaseapp.com",
            projectId: "print-express-bfa7c",
            storageBucket: "print-express-bfa7c.firebasestorage.app",
            messagingSenderId: "471136646915",
            appId: "1:471136646915:web:8b7b6f92c00d88c7c79b36",
            measurementId: "G-8K5LHHCDFE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const containerPedidos = document.getElementById("lista-pedidos");
        let totalPedidosAnterior = -1;

        // Solicita permissão para notificações sonoras/visuais no navegador
        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        // Função para tocar som de alerta quando chegar novo pedido
        function tocarAlertaSonoro() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Nota D5
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) {
                console.log("Áudio bloqueado pelo navegador até interação.");
            }
        }

        // Ouve a coleção 'pedidos' em tempo real ordenada pelos mais recentes
        const q = query(collection(db, "pedidos"), orderBy("dataEnvio", "desc"));

        onSnapshot(q, (snapshot) => {
            if (snapshot.empty) {
                containerPedidos.innerHTML = `<p class="sem-pedidos">Nenhum pedido recebido ainda. Aguardando...</p>";`;
                totalPedidosAnterior = 0;
                return;
            }

            // Verifica se chegou novo pedido para disparar notificação
            if (totalPedidosAnterior !== -1 && snapshot.size > totalPedidosAnterior) {
                tocarAlertaSonoro();
                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification("Novo Pedido PrintExpress!", {
                        body: "Um novo arquivo chegou para impressão.",
                        icon: "https://cdn-icons-png.flaticon.com/512/2933/2933888.png"
                    });
                }
            }
            totalPedidosAnterior = snapshot.size;

            let html = "";
            snapshot.forEach((docSnap) => {
                const p = docSnap.data();
                const docId = docSnap.id;
                
                let dataFormatada = 'Agora mesmo';
                if (p.dataEnvio && typeof p.dataEnvio.toDate === 'function') {
                    dataFormatada = p.dataEnvio.toDate().toLocaleString('pt-BR');
                }

                const totalFormatado = (typeof p.total === 'number') ? p.total.toFixed(2).replace('.', ',') : '0,00';
                const obs = p.observacoes ? p.observacoes : 'Nenhuma observação';
                const nomeArquivo = p.arquivoNome ? p.arquivoNome : 'arquivo';
                const linkArquivo = p.arquivoDados ? p.arquivoDados : '';
                const isConcluido = p.concluido === true;
                
                let infoTroco = '';
                if (p.pagamento === 'DINHEIRO' && p.troco) {
                    infoTroco = ` (Troco para: ${p.troco})`;
                }

                // Gerador de pré-visualização (Mostra imagem direto ou PDF em iframe se for Base64)
                let previewHTML = '';
                if (linkArquivo) {
                    if (linkArquivo.includes('image/') || nomeArquivo.match(/\.(png|jpg|jpeg)$/i)) {
                        previewHTML = `<div class="preview-container"><p style="font-size:12px; color:#94a3b8; margin-bottom:5px;">Pré-visualização da Imagem:</p><img src="${linkArquivo}" alt="Preview"></div>`;
                    } else if (linkArquivo.includes('application/pdf') || nomeArquivo.match(/\.pdf$/i)) {
                        previewHTML = `<div class="preview-container"><p style="font-size:12px; color:#94a3b8; margin-bottom:5px;">Pré-visualização do PDF:</p><iframe src="${linkArquivo}"></iframe></div>`;
                    } else {
                        previewHTML = `<div class="preview-container"><p style="font-size:12px; color:#94a3b8;">Conteúdo / Texto do Pedido:</p><textarea readonly style="width:100%; background:#1e293b; color:#cbd5e1; border:none; font-size:13px; height:60px;">${p.observacoes || nomeArquivo}</textarea></div>`;
                    }
                }

                html += `
                    <div class="pedido-card ${isConcluido ? 'concluido' : ''}" id="card-${docId}">
                        <div class="pedido-header">
                            <span class="cliente-nome">👤 ${p.cliente || 'Cliente'} ${isConcluido ? '✅ (Concluído)' : ''}</span>
                            <span class="pedido-total">R$ ${totalFormatado}</span>
                        </div>
                        <div class="pedido-info">
                            <p>📄 <strong>Serviço/Papel:</strong> ${p.papel || 'Padrão'} (${p.quantidade || 1} un)</p>
                            <p>💳 <strong>Pagamento:</strong> ${p.pagamento || 'PIX'}${infoTroco}</p>
                            <p>📝 <strong>Obs:</strong> ${obs}</p>
                            <p>📁 <strong>Arquivo:</strong> ${nomeArquivo}</p>
                            <p>🕒 <strong>Recebido em:</strong> ${dataFormatada}</p>
                        </div>

                        ${previewHTML}

                        <div class="btn-group-action">
                            <a href="${linkArquivo}" download="${nomeArquivo}" class="btn-download">📥 Baixar Arquivo</a>
                            <button class="btn-concluir" onclick="alternarConcluido('${docId}', ${!isConcluido})">
                                ${isConcluido ? '🔄 Reabrir Pedido' : '✔️ Marcar como Concluído'}
                            </button>
                        </div>
                    </div>
                `;
            });

            containerPedidos.innerHTML = html;
        });

        // Função global para alternar o status de concluído no Firestore
        window.alternarConcluido = async function(id, status) {
            try {
                const ref = doc(db, "pedidos", id);
                await updateDoc(ref, { concluido: status });
            } catch (err) {
                console.error("Erro ao atualizar status:", err);
                alert("Erro ao atualizar o pedido.");
            }
        };

        // Função para publicar aviso global que aparece no index.html
        window.publicarAviso = async function() {
            const textoAviso = document.getElementById("inputAviso").value.trim();
            try {
                await setDoc(doc(db, "config", "aviso"), {
                    texto: textoAviso,
                    atualizadoEm: new Date()
                });
                alert("Aviso publicado com sucesso no site!");
            } catch (err) {
                console.error("Erro ao publicar aviso:", err);
                alert("Erro ao publicar aviso.");
            }
        };

        // Carrega o texto atual do aviso ao abrir o painel
        async function carregarInputAviso() {
            try {
                const snap = await getDoc(doc(db, "config", "aviso"));
                if (snap.exists() && snap.data().texto) {
                    document.getElementById("inputAviso").value = snap.data().texto;
                }
            } catch(e) {
                console.log("Aviso prévio não encontrado.");
            }
        }
        carregarInputAviso();
    </script>
</body>
</html>
