<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Operador - PrintExpress</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #38bdf8; font-size: 24px; }
        p { color: #94a3b8; font-size: 14px; }
        .container { max-width: 900px; margin: 0 auto; }
        .pedido-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .pedido-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .cliente-nome { font-size: 18px; font-weight: bold; color: #f8fafc; }
        .pedido-total { font-size: 18px; font-weight: bold; color: #34d399; }
        .pedido-info { font-size: 14px; color: #cbd5e1; line-height: 1.6; margin-bottom: 15px; }
        .btn-download {
            background: #0284c7;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-block;
            transition: background 0.2s;
        }
        .btn-download:hover { background: #0369a1; }
        .sem-pedidos { text-align: center; color: #64748b; margin-top: 50px; font-size: 16px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🖨️ Painel de Pedidos - PrintExpress</h1>
            <p>Novos pedidos aparecem aqui automaticamente em tempo real.</p>
        </header>

        <div id="lista-pedidos">
            <p class="sem-pedidos">Carregando pedidos...</p>
        </div>
    </div>

    <!-- LÓGICA PARA BUSCAR OS PEDIDOS DO FIRESTORE EM TEMPO REAL -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        // Mesma configuração do Firebase do seu site
        const firebaseConfig = {
            apiKey: "AIzaSyAfh0iZSotPra1olpRWRfwwBP9G8yrdHEc",
            authDomain: "print-express-bfa7c.firebaseapp.com",
            projectId: "print-express-bfa7c",
            storageBucket: "print-express-bfa7c.firebasestorage.app",
            messagingSenderId: "471136646915",
            appId: "1:471136646915:web:8b7b6f92c00d88c7c79b36",
            measurementId: "G-8K5LHHCDFE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const containerPedidos = document.getElementById("lista-pedidos");

        // Ouve a coleção 'pedidos' em tempo real ordenada pelos mais recentes
        const q = query(collection(db, "pedidos"), orderBy("dataEnvio", "desc"));

        onSnapshot(q, (snapshot) => {
            if (snapshot.empty) {
                containerPedidos.innerHTML = `<p class="sem-pedidos">Nenhum pedido recebido ainda. Aguardando...</p>`;
                return;
            }

            let html = "";
            snapshot.forEach((doc) => {
                const p = doc.data();
                
                // Formata a data se existir
                const dataFormatada = p.dataEnvio ? new Date(p.dataEnvio.toDate()).toLocaleString('pt-BR') : 'Agora mesmo';

                html += `
                    <div class="pedido-card">
                        <div class="pedido-header">
                            <span class="cliente-nome">👤 ${p.cliente}</span>
                            <span class="pedido-total">R$ ${p.total.toFixed(2).replace('.', ',')}</span>
                        </div>
                        <div class="pedido-info">
                            <p>📄 <strong>Papel:</strong> ${p.papel} (${p.quantidade} un)</p>
                            <p>💳 <strong>Pagamento:</strong> ${p.pagamento} ${p.pagamento === 'DINHEIRO' ? `(Troco: ${p.troco})` : ''}</p>
                            <p>📝 <strong>Obs:</strong> ${p.observacoes}</p>
                            <p>📁 <strong>Arquivo:</strong> ${p.arquivoNome}</p>
                            <p>🕒 <strong>Recebido em:</strong> ${dataFormatada}</p>
                        </div>
                        <a href="${p.arquivoDados}" download="${p.arquivoNome}" class="btn-download">📥 Baixar Arquivo para Imprimir</a>
                    </div>
                `;
            });

            containerPedidos.innerHTML = html;
        });
    </script>
</body>
</html>
