<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Operador - PrintExpress Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        header { text-align: center; margin-bottom: 25px; }
        h1 { color: #38bdf8; font-size: 24px; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 14px; }
        .container { max-width: 950px; margin: 0 auto; }
        
        /* Bloco de Configurações de Notificação/Som */
        .config-bar {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .config-title { font-weight: 600; font-size: 14px; color: #e2e8f0; display: flex; align-items: center; gap: 8px; }
        .config-controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .toggle-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #cbd5e1; cursor: pointer; }
        .toggle-item input { accent-color: #38bdf8; cursor: pointer; }
        .btn-test { background: #334155; color: #f8fafc; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 500; }
        .btn-test:hover { background: #475569; }

        /* Métrica e Filtros */
        .dashboard-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .meta-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .meta-card span { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .meta-card h3 { font-size: 20px; color: #f8fafc; margin-top: 5px; }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .search-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            width: 100%;
            max-width: 300px;
            font-size: 14px;
        }
        .filter-buttons { display: flex; gap: 8px; }
        .btn-filter {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-filter.active { background: #0284c7; color: white; border-color: #0284c7; }

        /* Cards de Pedidos */
        .pedido-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: border-color 0.2s;
        }
        .pedido-card.concluido {
            opacity: 0.7;
            border-color: #059669;
        }
        .pedido-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .cliente-nome { font-size: 18px; font-weight: bold; color: #f8fafc; }
        .pedido-total { font-size: 18px; font-weight: bold; color: #34d399; }
        .pedido-info { font-size: 14px; color: #cbd5e1; line-height: 1.6; margin-bottom: 15px; }
        
        /* Pré-visualização do arquivo */
        .preview-container {
            margin: 15px 0;
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            text-align: center;
        }
        .preview-container img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 4px;
            object-fit: contain;
        }
        .preview-container iframe {
            width: 100%;
            height: 280px;
            border: none;
            border-radius: 4px;
        }

        /* Seção WhatsApp com mensagens personalizadas */
        .whatsapp-section {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .whatsapp-title { font-size: 13px; font-weight: 600; color: #22c55e; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .whatsapp-controls { display: flex; gap: 10px; flex-wrap: wrap; }
        .select-tipo-servico {
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 13px;
            flex-grow: 1;
        }
        .btn-whatsapp {
            background: #22c55e;
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .btn-whatsapp:hover { background: #16a34a; }

        /* Botões de Ação Principal */
        .btn-group-action { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
        .btn-download {
            background: #0284c7;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-download:hover { background: #0369a1; }
        
        .btn-concluir {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-concluir:hover { background: #059669; }

        .sem-pedidos { text-align: center; color: #64748b; margin-top: 50px; font-size: 16px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🖨️ Painel de Operador - PrintExpress</h1>
            <p>Gerencie pedidos, visualize documentos e envie notificações diretas aos clientes.</p>
        </header>

        <!-- Módulo de Notificação e Som -->
        <div class="config-bar">
            <div class="config-title">🔔 Alertas e Notificações</div>
            <div class="config-controls">
                <label class="toggle-item">
                    <input type="checkbox" id="chkSom" checked> Som de Alerta
                </label>
                <label class="toggle-item">
                    <input type="checkbox" id="chkNotificacao" checked> Pop-ups no Navegador
                </label>
                <button class="btn-test" onclick="testarAlerta()">🔊 Testar Alerta</button>
            </div>
        </div>

        <!-- Métrica do Dia -->
        <div class="dashboard-meta">
            <div class="meta-card">
                <span>Pendentes</span>
                <h3 id="meta-pendentes">0</h3>
            </div>
            <div class="meta-card">
                <span>Concluídos</span>
                <h3 id="meta-concluidos">0</h3>
            </div>
            <div class="meta-card">
                <span>Faturamento Total</span>
                <h3 id="meta-faturamento" style="color:#34d399;">R$ 0,00</h3>
            </div>
        </div>

        <!-- Barra de Busca e Filtros -->
        <div class="toolbar">
            <input type="text" id="inputBusca" class="search-box" placeholder="🔍 Buscar por cliente ou arquivo..." oninput="filtrarExibicao()">
            <div class="filter-buttons">
                <button class="btn-filter active" onclick="alterarFiltro('todos', this)">Todos</button>
                <button class="btn-filter" onclick="alterarFiltro('pendentes', this)">Pendentes</button>
                <button class="btn-filter" onclick="alterarFiltro('concluidos', this)">Concluídos</button>
            </div>
        </div>

        <!-- Lista de Pedidos -->
        <div id="lista-pedidos">
            <p class="sem-pedidos">Buscando pedidos diretamente do repositório do GitHub...</p>
        </div>
    </div>

    <!-- LÓGICA DE INTEGRAÇÃO COM GITHUB (SEM FIREBASE) -->
    <script>
        // ==========================================
        // CONFIGURAÇÕES DO SEU GITHUB
        // ==========================================
        const GITHUB_USER = "SEU_USUARIO_DO_GITHUB";     // Coloque seu nome de usuário exato do GitHub
        const GITHUB_REPO = "NOME_DO_REPOSITORIO_PRIVADO"; // Coloque o nome do seu repositório privado
        const GITHUB_TOKEN = ""; // Se configurado na Vercel via env var, o front-end busca os arquivos públicos ou via API serverless. Como estamos em site estático puro, coloque seu token 'ghp_...' aqui se quiser testar direto, ou configure via backend.

        let listaPedidosCache = [];
        let filtroAtual = 'todos';

        // Solicita permissão para notificações visuais
        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        window.tocarAlertaSonoro = function() {
            if (!document.getElementById("chkSom").checked) return;
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) {
                console.log("Áudio bloqueado pelo navegador.");
            }
        };

        window.testarAlerta = function() {
            window.tocarAlertaSonoro();
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("PrintExpress - Alerta de Teste", {
                    body: "O sistema de som e notificação está funcionando!",
                    icon: "https://cdn-icons-png.flaticon.com/512/2933/2933888.png"
                });
            }
        };

        // Função para carregar os pedidos direto da API do GitHub (Pastas do repositório privado)
        async function carregarPedidosDoGitHub() {
            const containerPedidos = document.getElementById("lista-pedidos");
            
            if (GITHUB_USER === "SEU_USUARIO_DO_GITHUB" || GITHUB_REPO === "NOME_DO_REPOSITORIO_PRIVADO") {
                containerPedidos.innerHTML = `<p class="sem-pedidos" style="color: #f87171;">⚠️ Atenção: Edite o código e coloque seu GITHUB_USER e GITHUB_REPO corretos!</p>`;
                return;
            }

            try {
                // Busca a lista de arquivos/pastas na raiz ou na pasta de pedidos do repositório
                const headers = {};
                // Se você tiver um token no código ou variável
                if (typeof GITHUB_TOKEN !== 'undefined' && GITHUB_TOKEN.trim() !== '') {
                    headers["Authorization"] = `token ${GITHUB_TOKEN}`;
                }

                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`, { headers });
                
                if (!response.ok) {
                    throw new Error("Não foi possível acessar o repositório. Verifique usuário, token ou nome do repositório.");
                }

                const contents = await response.json();
                
                // Filtra arquivos de pedidos (ex: formato JSON ou arquivos enviados)
                listaPedidosCache = [];
                let pendentes = 0;
                let concluidos = 0;
                let faturamento = 0;

                // Aqui mapeamos os arquivos encontrados no repositório
                for (let item of contents) {
                    if (item.type === "file" && (item.name.endsWith('.json') || item.name.includes('pedido'))) {
                        // Baixa o conteúdo do arquivo de pedido
                        const fileRes = await fetch(item.download_url);
                        const pedidoData = await fileRes.json();
                        
                        pedidoData.id = item.sha;
                        pedidoData.arquivoNome = pedidoData.arquivoNome || item.name;
                        pedidoData.concluido = pedidoData.concluido || false;
                        
                        listaPedidosCache.push(pedidoData);

                        if (pedidoData.concluido) concluidos++;
                        else pendentes++;

                        if (typeof pedidoData.total === 'number') faturamento += pedidoData.total;
                    }
                }

                // Atualiza o Dashboard
                document.getElementById("meta-pendentes").innerText = pendentes;
                document.getElementById("meta-concluidos").innerText = concluidos;
                document.getElementById("meta-faturamento").innerText = `R$ ${faturamento.toFixed(2).replace('.', ',')}`;

                filtrarExibicao();

            } catch (err) {
                console.error("Erro ao buscar do GitHub:", err);
                containerPedidos.innerHTML = `<p class="sem-pedidos">Nenhum pedido encontrado no repositório ou erro de conexão com o GitHub.</p>`;
            }
        }

        window.filtrarExibicao = function() {
            const containerPedidos = document.getElementById("lista-pedidos");
            const termoBusca = document.getElementById("inputBusca").value.toLowerCase();
            
            const pedidosFiltrados = listaPedidosCache.filter(p => {
                const bateFiltro = 
                    (filtroAtual === 'todos') ||
                    (filtroAtual === 'pendentes' && !p.concluido) ||
                    (filtroAtual === 'concluidos' && p.concluido);

                const nomeCliente = (p.cliente || '').toLowerCase();
                const nomeArq = (p.arquivoNome || '').toLowerCase();
                const bateBusca = nomeCliente.includes(termoBusca) || nomeArq.includes(termoBusca);

                return bateFiltro && bateBusca;
            });

            if (pedidosFiltrados.length === 0) {
                containerPedidos.innerHTML = `<p class="sem-pedidos">Nenhum pedido encontrado.</p>`;
                return;
            }

            let html = "";
            pedidosFiltrados.forEach((p) => {
                const docId = p.id;
                const dataFormatada = p.dataEnvio ? new Date(p.dataEnvio).toLocaleString('pt-BR') : 'Recente';
                const totalFormatado = (typeof p.total === 'number') ? p.total.toFixed(2).replace('.', ',') : '0,00';
                const obs = p.observacoes ? p.observacoes : 'Nenhuma observação';
                const nomeArquivo = p.arquivoNome ? p.arquivoNome : 'arquivo';
                const linkArquivo = p.arquivoDados ? p.arquivoDados : '#';
                const isConcluido = p.concluido === true;
                const telefone = p.telefone ? p.telefone.replace(/\D/g, '') : '';
                
                let infoTroco = '';
                if (p.pagamento === 'DINHEIRO' && p.troco) {
                    infoTroco = ` (Troco para: ${p.troco})`;
                }

                let previewHTML = '';
                if (linkArquivo && linkArquivo !== '#') {
                    if (linkArquivo.includes('image/') || nomeArquivo.match(/\.(png|jpg|jpeg)$/i)) {
                        previewHTML = `<div class="preview-container"><p style="font-size:12px; color:#94a3b8; margin-bottom:5px;">Pré-visualização:</p><img src="${linkArquivo}" alt="Preview"></div>`;
                    } else {
                        previewHTML = `<div class="preview-container"><p style="font-size:12px; color:#94a3b8;">Arquivo anexado disponível para download.</p></div>`;
                    }
                }

                html += `
                    <div class="pedido-card ${isConcluido ? 'concluido' : ''}" id="card-${docId}">
                        <div class="pedido-header">
                            <span class="cliente-nome">👤 ${p.cliente || 'Cliente'} ${isConcluido ? '✅ (Concluído)' : ''}</span>
                            <span class="pedido-total">R$ ${totalFormatado}</span>
                        </div>
                        <div class="pedido-info">
                            <p>📄 <strong>Serviço/Papel:</strong> ${p.papel || 'Padrão'} (${p.quantidade || 1} un)</p>
                            <p>💳 <strong>Pagamento:</strong> ${p.pagamento || 'PIX'}${infoTroco}</p>
                            <p>📝 <strong>Obs:</strong> ${obs}</p>
                            <p>📁 <strong>Arquivo:</strong> ${nomeArquivo}</p>
                            <p>🕒 <strong>Recebido em:</strong> ${dataFormatada}</p>
                        </div>

                        ${previewHTML}

                        <div class="whatsapp-section">
                            <div class="whatsapp-title">💬 Notificar Cliente via WhatsApp</div>
                            <div class="whatsapp-controls">
                                <select id="tipoServico-${docId}" class="select-tipo-servico">
                                    <option value="impressão">Sua impressão está pronta</option>
                                    <option value="fotos">Suas fotos estão prontas</option>
                                    <option value="currículo">Seu currículo está pronto</option>
                                    <option value="arte do Canva">Sua arte do Canva está pronta</option>
                                </select>
                                <button class="btn-whatsapp" onclick="enviarWhatsApp('${p.cliente || 'Cliente'}', '${telefone}', 'tipoServico-${docId}')">
                                    📱 Enviar Mensagem
                                </button>
                            </div>
                        </div>

                        <div class="btn-group-action">
                            <a href="${linkArquivo}" download="${nomeArquivo}" class="btn-download">📥 Baixar Arquivo</a>
                            <button class="btn-concluir" onclick="alternarConcluido('${docId}', ${!isConcluido})">
                                ${isConcluido ? '🔄 Reabrir' : '✔️ Marcar como Concluído'}
                            </button>
                        </div>
                    </div>
                `;
            });

            containerPedidos.innerHTML = html;
        };

        window.alterarFiltro = function(tipo, elemento) {
            filtroAtual = tipo;
            document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
            elemento.classList.add('active');
            filtrarExibicao();
        };

        window.enviarWhatsApp = function(nomeCliente, telefone, idSelect) {
            const tipoSelecionado = document.getElementById(idSelect).value;
            const mensagem = `Olá, ${nomeCliente}! Passando para avisar que a sua ${tipoSelecionado} já está pronta para retirada/envio. Muito obrigado pela preferência! 😊`;
            
            let url = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensagem)}`;
            if (telefone) {
                url = `https://api.whatsapp.com/send?phone=${telefone}&text=${encodeURIComponent(mensagem)}`;
            }
            window.open(url, '_blank');
        };

        window.alternarConcluido = function(id, status) {
            const p = listaPedidosCache.find(x => x.id === id);
            if (p) {
                p.concluido = status;
                filtrarExibicao();
                alert("Status atualizado na visualização atual.");
            }
        };

        // Inicia a busca ao carregar a página
        carregarPedidosDoGitHub();
    </script>
</body>
</html>
