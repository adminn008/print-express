<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Operador - PrintExpress Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        header { text-align: center; margin-bottom: 25px; }
        h1 { color: #38bdf8; font-size: 24px; }
        p { color: #94a3b8; font-size: 14px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        .aviso-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .aviso-box h2 { font-size: 16px; color: #38bdf8; margin-bottom: 10px; }
        .aviso-box textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            padding: 10px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .btn-aviso {
            background: #f59e0b;
            color: #000;
            border: none;
            padding: 10px 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .pedido-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .pedido-card.concluido { opacity: 0.55; border-color: #10b981; }
        .pedido-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 10px; }
        .cliente-nome { font-size: 18px; font-weight: bold; color: #f8fafc; }
        .pedido-total { font-size: 18px; font-weight: bold; color: #34d399; }
        .pedido-info { font-size: 14px; color: #cbd5e1; line-height: 1.6; margin-bottom: 15px; }
        
        .btn-group-action { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-download {
            background: #0284c7; color: white; padding: 10px 16px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px;
        }
        .btn-concluir {
            background: #10b981; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer;
        }

        .preview-container {
            margin: 10px 0 15px 0; background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #334155; text-align: center;
        }
        .preview-container img { max-width: 100%; max-height: 200px; object-fit: contain; }
        .preview-container iframe { width: 100%; height: 200px; border: none; }
        .sem-pedidos { text-align: center; color: #64748b; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🖨️ Painel do Operador - PrintExpress</h1>
            <p>Gerenciamento de Pedidos e Avisos Globais</p>
        </header>

        <div class="aviso-box">
            <h2>📢 Publicar Aviso Global no Site (index.html)</h2>
            <textarea id="inputAviso" rows="2" placeholder="Digite um aviso importante para ser exibido no topo do site..."></textarea>
            <button class="btn-aviso" onclick="publicarAviso()">Atualizar Aviso no Site 🚀</button>
        </div>

        <div id="lista-pedidos">
            <p class="sem-pedidos">Carregando pedidos...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAfh0iZSotPra1olpRWRfwwBP9G8yrdHEc",
            authDomain: "print-express-bfa7c.firebaseapp.com",
            projectId: "print-express-bfa7c",
            storageBucket: "print-express-bfa7c.firebasestorage.app",
            messagingSenderId: "471136646915",
            appId: "1:471136646915:web:8b7b6f92c00d88c7c79b36",
            measurementId: "G-8K5LHHCDFE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const containerPedidos = document.getElementById("lista-pedidos");

        const q = query(collection(db, "pedidos"), orderBy("dataEnvio", "desc"));

        onSnapshot(q, (snapshot) => {
            if (snapshot.empty) {
                containerPedidos.innerHTML = `<p class="sem-pedidos">Nenhum pedido recebido ainda.</p>`;
                return;
            }

            let html = "";
            snapshot.forEach((docSnap) => {
                const p = docSnap.data();
                const docId = docSnap.id;
                
                let dataFormatada = p.dataEnvio?.toDate ? p.dataEnvio.toDate().toLocaleString('pt-BR') : 'Agora mesmo';
                const totalFormatado = typeof p.total === 'number' ? p.total.toFixed(2).replace('.', ',') : '0,00';
                const isConcluido = p.concluido === true;
                const linkArquivo = p.arquivoDados || '';
                const nomeArquivo = p.arquivoNome || 'arquivo';

                let previewHTML = '';
                if (linkArquivo) {
                    if (linkArquivo.includes('image/') || nomeArquivo.match(/\.(png|jpg|jpeg)$/i)) {
                        previewHTML = `<div class="preview-container"><img src="${linkArquivo}"></div>`;
                    } else if (linkArquivo.includes('application/pdf') || nomeArquivo.match(/\.pdf$/i)) {
                        previewHTML = `<div class="preview-container"><iframe src="${linkArquivo}"></iframe></div>`;
                    }
                }

                html += `
                    <div class="pedido-card ${isConcluido ? 'concluido' : ''}">
                        <div class="pedido-header">
                            <span class="cliente-nome">👤 ${p.cliente || 'Cliente'} ${isConcluido ? '✅ (Concluído)' : ''}</span>
                            <span class="pedido-total">R$ ${totalFormatado}</span>
                        </div>
                        <div class="pedido-info">
                            <p>📞 <strong>Telefone:</strong> ${p.telefone || 'Não informado'}</p>
                            <p>📄 <strong>Serviço:</strong> ${p.papel || 'Padrão'} (${p.quantidade || 1} un)</p>
                            <p>💳 <strong>Pagamento:</strong> ${p.pagamento || 'PIX'} ${p.troco ? `(Troco: ${p.troco})` : ''}</p>
                            <p>📝 <strong>Obs:</strong> ${p.observacoes || 'Nenhuma'}</p>
                            <p>🕒 <strong>Data:</strong> ${dataFormatada}</p>
                        </div>

                        ${previewHTML}

                        <div class="btn-group-action">
                            ${linkArquivo ? `<a href="${linkArquivo}" download="${nomeArquivo}" class="btn-download">📥 Baixar Arquivo</a>` : ''}
                            <button class="btn-concluir" onclick="alternarConcluido('${docId}', ${!isConcluido})">
                                ${isConcluido ? '🔄 Reabrir Pedido' : '✔️ Marcar como Concluído'}
                            </button>
                        </div>
                    </div>
                `;
            });

            containerPedidos.innerHTML = html;
        });

        window.alternarConcluido = async function(id, status) {
            try {
                await updateDoc(doc(db, "pedidos", id), { concluido: status });
            } catch (err) { alert("Erro ao alterar status do pedido."); }
        };

        window.publicarAviso = async function() {
            const textoAviso = document.getElementById("inputAviso").value.trim();
            try {
                await setDoc(doc(db, "config", "aviso"), { texto: textoAviso, atualizadoEm: new Date() });
                alert("Aviso publicado com sucesso no site!");
            } catch (err) { alert("Erro ao publicar aviso."); }
        };

        async function carregarAvisoExistente() {
            try {
                const snap = await getDoc(doc(db, "config", "aviso"));
                if (snap.exists() && snap.data().texto) {
                    document.getElementById("inputAviso").value = snap.data().texto;
                }
            } catch(e) {}
        }
        carregarAvisoExistente();
    </script>
</body>
</html>
