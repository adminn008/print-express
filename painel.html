<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - PrintExpress Pro</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e2f; color: #fff; margin: 0; padding: 20px; }
        h1, h2 { text-align: center; color: #ff4757; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #2d2d44; border-left: 5px solid #2ed573; padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card.pendente { border-left-color: #ffa502; }
        button { background: #ff4757; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; width: 100%; }
        button:hover { background: #ff6b81; }
        .btn-green { background: #2ed573; }
        .banner-box { background: #2d2d44; padding: 15px; border-radius: 8px; margin-bottom: 20px; max-width: 600px; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>

<h1>Painel de Controle - PrintExpress Pro</h1>

<!-- Configurar Aviso Global -->
<div class="banner-box">
    <h3>📢 Enviar Aviso Global para o Site</h3>
    <input type="text" id="globalNoticeInput" placeholder="Digite o aviso que aparecerá no topo do site..." style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 4px; border: none;">
    <button class="btn-green" onclick="sendGlobalNotice()">Publicar Aviso</button>
</div>

<h2>Pedidos Recebidos em Tempo Real</h2>
<div id="ordersContainer" class="grid">
    <p style="text-align: center; grid-column: 1/-1;">Carregando pedidos...</p>
</div>

<!-- Modal / Pré-visualização de Arquivo -->
<div id="previewModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center;">
    <div style="background:#fff; color:#333; padding:20px; border-radius:8px; max-width:500px; width:100%; text-align:center;">
        <h3>Pré-visualização do Arquivo</h3>
        <div id="previewContent" style="margin: 15px 0; max-height: 300px; overflow:auto;"></div>
        <button onclick="closePreview()" style="background:#333;">Fechar</button>
    </div>
</div>

<script>
    // CONFIGURAÇÃO DO FIREBASE (Insira as mesmas credenciais aqui)
    const firebaseConfig = {
        apiKey: "SUA_API_KEY",
        authDomain: "seu-projeto.firebaseapp.com",
        projectId: "seu-projeto",
        storageBucket: "seu-projeto.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:12345:web:abcde"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Notificação sonora simples usando a API de Áudio nativa do navegador
    function playBeep() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = 587.33; // Nota D5
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
    }

    // Escutar pedidos em tempo real no Firestore e disparar notificação se houver novo pedido
    let firstLoad = true;
    db.collection("pedidos").orderBy("createdAt", "desc").onSnapshot(snapshot => {
        const container = document.getElementById('ordersContainer');
        container.innerHTML = '';
        
        if(snapshot.empty) {
            container.innerHTML = '<p style="text-align: center; grid-column: 1/-1;">Nenhum pedido no momento.</p>';
            firstLoad = false;
            return;
        }

        if(!firstLoad) {
            playBeep(); // Toca som quando chega novo pedido
        }
        firstLoad = false;

        snapshot.forEach(docSnap => {
            const data = docSnap.data();
            const id = docSnap.id;
            
            const card = document.createElement('div');
            card.className = `card ${data.status || 'pendente'}`;
            
            let extraDetails = '';
            if(data.type === 'impressao') {
                extraDetails = `<p><strong>Arquivo:</strong> ${data.fileName}</p>`;
                if(data.fileBase64) {
                    extraDetails += `<button onclick="previewFile('${data.fileBase64}', '${data.fileName}')">👁️ Ver Arquivo Antes de Baixar</button>`;
                }
                if(data.research) extraDetails += `<p><strong>Pesquisa Web:</strong> ${data.research}</p>`;
            } else if(data.type === 'curriculo') {
                extraDetails = `<p><strong>Modelo Escolhido:</strong> #${data.model}</p><p><strong>Dados:</strong> ${data.details}</p>`;
            } else if(data.type === 'canva') {
                extraDetails = `<p><strong>Pedido Canva:</strong> ${data.details}</p>`;
            }

            card.innerHTML = `
                <h3>Cliente: ${data.client}</h3>
                <p><strong>Tipo:</strong> ${data.type.toUpperCase()}</p>
                <p><strong>Preço:</strong> R$ ${data.price || '0.00'}</p>
                ${extraDetails}
                <p><strong>Status:</strong> ${data.status}</p>
                ${data.status !== 'concluido' ? `<button class="btn-green" onclick="markAsCompleted('${id}')">Marcar como Concluído</button>` : '<p style="color:#2ed573; text-align:center;"><b>Concluído</b></p>'}
            `;
            container.appendChild(card);
        });
    });

    function markAsCompleted(id) {
        db.collection("pedidos").doc(id).update({ status: "concluido" });
    }

    function sendGlobalNotice() {
        const texto = document.getElementById('globalNoticeInput').value;
        db.collection("config").doc("aviso").set({ texto }).then(() => {
            alert('Aviso publicado com sucesso no site!');
        });
    }

    function previewFile(base64, name) {
        const content = document.getElementById('previewContent');
        if(name.match(/\.(jpg|jpeg|png|gif)$/i)) {
            content.innerHTML = `<img src="${base64}" style="max-width:100%; border-radius:4px;">`;
        } else {
            content.innerHTML = `<p>Arquivo: <b>${name}</b></p><a href="${base64}" download="${name}" style="background:#ff4757; color:#fff; padding:10px; text-decoration:none; display:inline-block; border-radius:4px;">Baixar Arquivo Diretamente</a>`;
        }
        document.getElementById('previewModal').style.display = 'flex';
    }

    function closePreview() {
        document.getElementById('previewModal').style.display = 'none';
    }
</script>

</body>
</html>
