<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintExpress - Gráfica e Cópias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow-sm py-4 px-6 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-print text-indigo-600 text-2xl"></i>
            <span class="text-xl font-bold tracking-tight text-gray-900">Print<span class="text-indigo-600">Express</span></span>
        </div>
    </header>

    <!-- Hero / Main -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center border border-gray-100">
            <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-6 text-2xl">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Acompanhe seu Pedido</h1>
            <p class="text-gray-500 text-sm mb-6">Digite o código recebido para ver o andamento em tempo real.</p>
            
            <form action="acompanhar.html" method="GET" class="space-y-4">
                <div>
                    <input type="text" name="codigo" required placeholder="Digite Aqui" 
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-center uppercase tracking-widest font-bold text-lg">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 shadow-md">
                    Acompanhar Pedido
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-gray-400">
        &copy; 2026 PrintExpress. Todos os direitos reservados.
    </footer>

</body>
</html>
