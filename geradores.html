<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador Fácil — Crie documentos online de forma rápida e simples</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <!-- CABEÇALHO -->
    <header class="navbar">
        <div class="container nav-container">
            <div class="brand" onclick="app.navigate('home')">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">Gerador<strong>Fácil</strong></span>
            </div>
            
            <nav class="nav-links" id="navLinks">
                <button onclick="app.navigate('home')" class="nav-btn">Início</button>
                <button onclick="app.navigate('generators')" class="nav-btn">Geradores</button>
                <button onclick="app.navigate('history')" class="nav-btn">Meus Documentos</button>
                <button onclick="app.navigate('privacy')" class="nav-btn">Privacidade</button>
            </nav>

            <div class="nav-actions">
                <button id="themeToggle" class="theme-toggle" title="Alternar tema">🌙</button>
                <button class="hamburger" id="hamburgerBtn">☰</button>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO DINÂMICO -->
    <main id="app" class="container main-content"></main>

    <!-- RODAPÉ -->
    <footer class="footer">
        <div class="container footer-content">
            <p>&copy; 2026 Gerador Fácil. Todos os direitos reservados. Processamento 100% local e seguro.</p>
            <div class="footer-links">
                <a href="#" onclick="app.navigate('privacy')">Política de Privacidade</a>
            </div>
        </div>
    </footer>

    <!-- SCRIPTS -->
    <script src="js/database.js"></script>
    <script src="js/forms.js"></script>
    <script src="js/pdfEngine.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
