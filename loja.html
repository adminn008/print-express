<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site em Manutenção</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 600px;
            width: 100%;
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-box {
            font-size: 64px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            color: #38bdf8;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 1.05rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-fill {
            width: 75%;
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            border-radius: 4px;
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .contact-btn {
            display: inline-block;
            padding: 12px 28px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .contact-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
        }

        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-box">⚙️</div>
        <h1>Voltamos em Breve!</h1>
        <p>Estamos realizando melhorias e atualizações no nosso site para oferecer uma experiência ainda melhor para você. Agradecemos a sua paciência.</p>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <a href="mailto:contato@seuemail.com" class="contact-btn">Fale Conosco</a>
    </div>
</body>
</html>

                </div>

                    <img id="qrPix" src="qrcode-pix.jpg" alt="QR Code Pix" style="width: 120px; height: 120px; border-radius: 6px; background: #fff; padding: 4px;">
                    
                    <div class="pix-copy-area">
                        <input type="text" id="pixCopiaCola" readonly>
                        <button class="btn-copy" onclick="copiarPix()">Copiar Chave</button>
                    </div>
                    <p style="font-size: 11px; color: var(--primary); margin-top: 6px; word-break: break-all;">Chave: ws8530135@gmail.com</p>
                </div>
            </div>

        </div>

    <script>
        let carrinho = [];
        let metPagamento = 'pix';
        const CHAVE_PIX = "00020101021126580014br.gov.bcb.pix0136b8bbc0cc-afe0-4544-8f18-b2d4621783175204000053039865802BR5922WELINGTON DE L E SILVA6013SAO JOSE DOS 62070503***630440CB";
        const WHATSAPP_NUM = "5541999682836";

        function mostrarToast(mensagem) {
            const toast = document.getElementById('toast');
            toast.innerText = mensagem;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function adicionarAoCarrinho(nome, valor) {
            carrinho.push({ nome, valor });
            atualizarBarraCarrinho();
            mostrarToast(`✨ "${nome}" adicionado!`);
        }

        function removerDoCarrinho(index) {
            carrinho.splice(index, 1);
            atualizarBarraCarrinho();
            if(carrinho.length > 0) {
                abrirCheckoutCarrinho();
            } else {
                fecharCheckout();
            }
            mostrarToast(`🗑️ Item removido do carrinho.`);
        }

        function atualizarBarraCarrinho() {
            const qtd = carrinho.length;
            const subtotal = carrinho.reduce((acc, item) => acc + item.valor, 0);
            
            document.getElementById('cartCount').innerText = qtd;
            document.getElementById('cartSubtotal').innerText = `R$ ${subtotal.toFixed(2).replace('.', ',')}`;
            
            const cartBar = document.getElementById('cartBar');
            if(qtd > 0) {
                cartBar.style.display = 'flex';
            } else {
                cartBar.style.display = 'none';
            }
        }

        function abrirCheckoutCarrinho() {
            const subtotal = carrinho.reduce((acc, item) => acc + item.valor, 0);
            document.getElementById('modalTitle').innerText = `Finalizar Pedido (Total: R$ ${subtotal.toFixed(2).replace('.', ',')})`;
            
            let resumoHTML = '<strong style="color: #fff; display:block; margin-bottom:6px;">Itens no seu carrinho:</strong>';
            carrinho.forEach((item, idx) => {
                resumoHTML += `
                    <div class="summary-item">
                        <span>${item.nome} - <strong>R$ ${item.valor.toFixed(2).replace('.', ',')}</strong></span>
                        <button class="btn-remove-item" onclick="removerDoCarrinho(${idx})">Remover</button>
                    </div>`;
            });
            document.getElementById('modalSummary').innerHTML = resumoHTML;
            
            document.getElementById('pixCopiaCola').value = CHAVE_PIX;
            document.getElementById('modalCheckout').classList.add('active');
        }

        function fecharCheckout() {
            document.getElementById('modalCheckout').classList.remove('active');
        }

        function setPayMethod(tipo) {
            metPagamento = tipo;
            document.getElementById('optPix').classList.toggle('active', tipo === 'pix');
            document.getElementById('optDinheiro').classList.toggle('active', tipo === 'dinheiro');
            document.getElementById('pixContainer').style.display = tipo === 'pix' ? 'block' : 'none';
        }

        function copiarPix() {
            const inputCopia = document.getElementById('pixCopiaCola');
            inputCopia.select();
            inputCopia.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(inputCopia.value).then(() => {
                mostrarToast('📋 Chave Pix copiada com sucesso!');
            }).catch(() => {
                alert('Erro ao tentar copiar. Selecione manualmente.');
            });
        }

        function confirmarPedidoWhatsApp() {
            const nome = document.getElementById('custName').value.trim();
            const fone = document.getElementById('custPhone').value.trim();

            if(!nome || !fone) {
                alert('Por favor, informe seu Nome e WhatsApp.');
                return;
            }

            const subtotal = carrinho.reduce((acc, item) => acc + item.valor, 0);
            let pagTxt = metPagamento === 'pix' ? 'Pix' : 'Dinheiro na Retirada';

            let msg = `Olá! Gostaria de fechar o pedido:\n`;
            carrinho.forEach(item => {
                msg += `- *${item.nome}* (R$ ${item.valor.toFixed(2).replace('.', ',')})\n`;
            });
            msg += `\n👤 Nome: ${nome}\n📱 WhatsApp: ${fone}\n💰 *Subtotal/Total: R$ ${subtotal.toFixed(2).replace('.', ',')}*\n💳 Pagamento: ${pagTxt}`;
            
            window.open(`https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(msg)}`, '_blank');
            fecharCheckout();
        }
    </script>
